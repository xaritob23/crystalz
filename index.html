<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crystalz — Три в ряд</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
html,body { width:100%; height:100%; overflow:hidden; font-family:'Segoe UI',Roboto,system-ui,sans-serif; }
body {
    background:#0a0e1a;
    display:flex; justify-content:center; align-items:center;
    transition: background 1s ease;
}
body.season-winter { background: linear-gradient(160deg,#0a1220 0%,#1a2a45 50%,#0d1a30 100%); }
body.season-spring { background: linear-gradient(160deg,#0a1a10 0%,#1a3a25 50%,#0d2015 100%); }
body.season-summer { background: linear-gradient(160deg,#0a1a2a 0%,#1a3a5a 50%,#0d2540 100%); }
body.season-autumn { background: linear-gradient(160deg,#1a0e05 0%,#3a2010 50%,#201005 100%); }

#app {
    width:100%; height:100%; max-width:520px; max-height:100vh;
    position:relative; display:flex; flex-direction:column;
    overflow:hidden;
}

#weatherLayer {
    position:absolute; inset:0; pointer-events:none; overflow:hidden;
    z-index:1;
    contain: strict;
}
#weatherLayer .rain-drop {
    position:absolute; width:2px;
    background:linear-gradient(transparent,rgba(180,210,255,.7));
    animation:rainfall linear infinite;
    will-change: transform;
    backface-visibility: hidden;
}
@keyframes rainfall {
    0% { transform: translate3d(0,-20px,0); opacity:0; }
    10% { opacity:1; }
    100% { transform: translate3d(0,100vh,0); opacity:.3; }
}
#weatherLayer .snow-flake {
    position:absolute; color:rgba(255,255,255,.8);
    animation:snowfall linear infinite;
    will-change: transform;
    backface-visibility: hidden;
}
@keyframes snowfall {
    0% { transform: translate3d(0,-20px,0); opacity:0; }
    10% { opacity:1; }
    100% { transform: translate3d(40px,100vh,0); opacity:.2; }
}
#weatherLayer .cloud {
    position:absolute; background:rgba(255,255,255,.06); border-radius:50%;
    filter:blur(20px); animation:cloudmove linear infinite;
    will-change: transform;
    backface-visibility: hidden;
}
@keyframes cloudmove {
    0% { transform: translate3d(-100%,0,0); }
    100% { transform: translate3d(100vw,0,0); }
}

#menu {
    position:absolute; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; text-align:center;
    transition: opacity .5s, visibility .5s;
    overflow:hidden; overflow-y:auto;
}
#menu.hidden { opacity:0; visibility:hidden; pointer-events:none; }

#menu::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    transition: background 1.5s ease;
    z-index:0;
}
#menu.time-morning::before { background: radial-gradient(ellipse at 30% 20%, rgba(255,220,150,.15), transparent 60%); }
#menu.time-day::before { background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.08), transparent 70%); }
#menu.time-evening::before { background: radial-gradient(ellipse at 70% 30%, rgba(255,150,80,.18), transparent 60%); }
#menu.time-night::before { background: radial-gradient(ellipse at 50% 10%, rgba(120,150,255,.12), transparent 60%); }

.menu-content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:400px; padding:20px 0; }

.menu-top-bar {
    position:fixed; top:14px; right:14px; z-index:10;
    display:flex; gap:8px;
}
.lang-btn, .icon-top-btn {
    background:rgba(30,45,60,.85); border:1px solid rgba(70,100,140,.5);
    color:#b7d3f0; padding:6px 12px; border-radius:20px;
    font-size:12px; font-weight:700; cursor:pointer; transition:.2s;
    -webkit-tap-highlight-color:transparent;
    letter-spacing:.5px;
}
.icon-top-btn { padding:6px 10px; font-size:14px; }
.lang-btn:hover, .icon-top-btn:hover { background:rgba(50,75,100,.95); }
.lang-btn:active, .icon-top-btn:active { transform:scale(.95); }
.lang-btn.active { background:#2b6a9e; border-color:#4084bf; color:#fff; }
.icon-top-btn.active { background:#2b6a9e; border-color:#4084bf; color:#fff; }

.menu-title {
    font-size:clamp(38px,12vw,60px); font-weight:900; letter-spacing:-2px;
    background:linear-gradient(135deg,#d6e6ff,#96b9e6,#c8a0ff,#ffb0c8,#d6e6ff);
    background-size:300% 300%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    margin-bottom:2px;
    animation:
        titleShine 6s ease-in-out infinite,
        titleFloat 4s ease-in-out infinite,
        titleGlow 3s ease-in-out infinite;
    will-change:transform, filter, background-position;
    filter: drop-shadow(0 0 20px rgba(180,150,255,.5));
}
@keyframes titleShine { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
@keyframes titleFloat { 0%,100% { transform:translateY(0) scale(1); } 50% { transform:translateY(-8px) scale(1.03); } }
@keyframes titleGlow {
    0%,100% { filter: drop-shadow(0 0 15px rgba(180,150,255,.4)) drop-shadow(0 0 30px rgba(150,180,230,.2)); }
    50% { filter: drop-shadow(0 0 30px rgba(200,170,255,.8)) drop-shadow(0 0 60px rgba(150,180,230,.5)); }
}

.menu-subtitle { color:#7c9ab9; font-size:13px; letter-spacing:2px; text-transform:uppercase; margin-bottom:12px; }
.menu-info { color:#5b7897; font-size:12px; line-height:1.6; margin-top:4px; }
.menu-info .season-name { color:#9bbad9; font-weight:600; }
.menu-info .time-name { color:#9bbad9; font-weight:600; }
.menu-info .weather-name { color:#9bbad9; font-weight:600; }

.menu-btn {
    width:100%; padding:16px 24px; border-radius:60px; border:none;
    font-size:17px; font-weight:700; cursor:pointer; transition:.25s;
    display:flex; align-items:center; justify-content:center; gap:10px;
    letter-spacing:.3px; color:#fff;
    -webkit-tap-highlight-color:transparent;
}
.menu-btn:active { transform:scale(.97); }
.menu-btn-classic {
    background:linear-gradient(135deg,#2b6a9e,#1e4d75);
    box-shadow:0 6px 24px rgba(43,106,158,.5), inset 0 1px 0 rgba(255,255,255,.15);
    border:1px solid rgba(100,160,220,.4);
}
.menu-btn-classic:hover { background:linear-gradient(135deg,#347bb8,#2b6a9e); box-shadow:0 8px 30px rgba(43,106,158,.6); }
.menu-btn-stones {
    background:linear-gradient(135deg,#6e5a2d,#4a3a1a);
    box-shadow:0 6px 24px rgba(138,106,47,.5), inset 0 1px 0 rgba(255,255,255,.15);
    border:1px solid rgba(180,160,100,.4);
}
.menu-btn-stones:hover { background:linear-gradient(135deg,#8a6a3a,#6e5a2d); box-shadow:0 8px 30px rgba(138,106,47,.6); }

.menu-stats {
    margin-top:10px; display:flex; gap:16px; font-size:12px; color:#5b7897;
    background:rgba(20,30,42,.6); padding:10px 20px; border-radius:40px;
    border:1px solid rgba(60,80,110,.3);
}
.menu-stats .val { color:#c8ddf0; font-weight:700; }

.atmo-panel {
    margin-top:10px; width:100%;
    background:rgba(20,30,42,.7); border-radius:20px; padding:12px 14px;
    border:1px solid rgba(60,80,110,.4);
    display:flex; flex-direction:column; gap:8px;
}
.atmo-row {
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; font-size:12px; color:#9bbad9;
}
.atmo-row .atmo-label { color:#7c9ab9; font-weight:600; min-width:60px; text-align:left; }
.atmo-btns { display:flex; gap:4px; flex-wrap:wrap; }
.atmo-btn {
    background:rgba(37,58,77,.8); border:1px solid rgba(58,84,107,.6);
    color:#b7d3f0; padding:4px 10px; border-radius:14px;
    font-size:11px; font-weight:600; cursor:pointer; transition:.2s;
    -webkit-tap-highlight-color:transparent;
}
.atmo-btn:hover:not(:disabled) { background:rgba(50,75,100,.9); }
.atmo-btn.active { background:#2b6a9e; border-color:#4084bf; color:#fff; }
.atmo-btn:active:not(:disabled) { transform:scale(.95); }
.atmo-btn:disabled { opacity:.35; cursor:not-allowed; filter:grayscale(.7); }

.bottom-links {
    display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; justify-content:center;
}
.bottom-link {
    background:rgba(30,45,60,.7); border:1px solid rgba(70,100,140,.4);
    color:#9bbad9; padding:6px 14px; border-radius:20px;
    font-size:11px; font-weight:600; cursor:pointer; transition:.2s;
    -webkit-tap-highlight-color:transparent;
    display:flex; align-items:center; gap:5px;
}
.bottom-link:hover { background:rgba(50,75,100,.9); color:#c8ddf0; }
.bottom-link:active { transform:scale(.95); }

#game {
    position:absolute; inset:0; z-index:10;
    display:none; flex-direction:column;
    transition: opacity .4s;
    background:transparent;
}
#game.active { display:flex; }

.game-header {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px;
    background:rgba(15,24,34,.9);
    border-bottom:1px solid rgba(40,60,90,.6);
    z-index:20;
    flex-shrink:0;
}
.score-display { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; color:#c8ddf0; }
.score-display .label { color:#6c93b9; font-size:12px; font-weight:500; }
.game-buttons { display:flex; gap:8px; }
.icon-btn {
    width:36px; height:36px; border-radius:10px; border:none;
    background:rgba(37,58,77,.8); color:#b7d3f0; font-size:16px;
    cursor:pointer; transition:.2s; display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(58,84,107,.6);
    -webkit-tap-highlight-color:transparent;
}
.icon-btn:active { transform:scale(.92); background:rgba(50,75,100,.9); }
.icon-btn.active { background:#2b6a9e; border-color:#4084bf; color:#fff; }

.board-wrap {
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:8px; overflow:hidden; min-height:0;
    position:relative; z-index:5;
}
#board {
    display:grid; gap:2px; padding:6px; border-radius:14px;
    background:rgba(10,16,24,.8);
    box-shadow: 0 0 40px rgba(0,0,0,.6);
    border:1px solid rgba(60,90,130,.5);
    position:relative;
    touch-action:none;
    contain: layout paint;
}
.cell {
    width:100%; height:100%; position:relative;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .15s ease;
    border-radius:8px;
}
.cell.selected {
    background:rgba(120,180,240,.2);
    box-shadow: inset 0 0 0 2px rgba(140,200,255,.9);
}

.crystal {
    width:88%; height:88%; position:relative;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .25s ease;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:flex; align-items:center; justify-content:center;
    will-change: auto;
}
.crystal.animating { will-change: transform; }
.crystal.lit { filter: drop-shadow(0 0 8px var(--glow)); }
.crystal.lit-bright { filter: drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 20px var(--glow)); }

.crystal.hint { animation: hintPulse 1.1s ease-in-out infinite; }
@keyframes hintPulse {
    0%,100% { transform:scale(1); filter:brightness(1) drop-shadow(0 0 8px var(--glow, #fff)); }
    50% { transform:scale(1.18); filter:brightness(1.6) drop-shadow(0 0 20px var(--glow, #fff)); }
}

.shape-triangle { clip-path:polygon(50% 5%,95% 90%,5% 90%); }
.shape-diamond { clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%); }
.shape-hexagon { clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%); }
.shape-circle { border-radius:50%; }
.shape-square { border-radius:18%; }
.shape-star { clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); }
.shape-pentagon { clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%); }
.shape-octagon { clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%); }
.shape-drop {
    clip-path: polygon(
        50% 0%, 65% 15%, 78% 32%, 88% 50%, 92% 66%,
        88% 80%, 78% 92%, 65% 98%, 50% 100%,
        35% 98%, 22% 92%, 12% 80%, 8% 66%,
        12% 50%, 22% 32%, 35% 15%
    );
}
.shape-vortex {
    clip-path: polygon(
        50% 0%, 72% 18%, 88% 10%, 90% 38%,
        100% 55%, 82% 72%, 78% 95%, 55% 88%,
        35% 100%, 22% 80%, 0% 68%, 15% 45%,
        5% 22%, 28% 18%, 42% 0%
    );
}

.c-red { background:linear-gradient(135deg,#ff5566,#c0392b,#ff8a9a); --glow:#ff5060; }
.c-orange { background:linear-gradient(135deg,#ffb033,#e67e22,#ffd680); --glow:#ffa030; }
.c-yellow { background:linear-gradient(135deg,#ffe566,#f1c40f,#fff5b0); --glow:#ffe050; }
.c-green { background:linear-gradient(135deg,#3ee683,#27ae60,#8affb0); --glow:#40e080; }
.c-cyan { background:linear-gradient(135deg,#80eeff,#00b4d8,#b8f5ff); --glow:#60e0ff; }
.c-blue { background:linear-gradient(135deg,#6a6aff,#3a3acc,#9090ff); --glow:#7070ff; }
.c-purple { background:linear-gradient(135deg,#b56ef5,#8e44ad,#d8b0ff); --glow:#b060f0; }
.c-pink { background:linear-gradient(135deg,#ff7fb0,#e84393,#ffc0d8); --glow:#ff70a8; }
.c-white { background:linear-gradient(135deg,#ffffff,#e0e2ea,#ffffff); --glow:#ffffff; }

.crystal::before {
    content:''; position:absolute; inset:0;
    border-radius:inherit;
    background:linear-gradient(135deg, rgba(255,255,255,.35) 0%, transparent 40%, transparent 60%, rgba(0,0,0,.2) 100%);
    pointer-events:none;
    clip-path:inherit;
    z-index:1;
}
.crystal.has-texture::before { display:none; }
.shape-circle.crystal::before { border-radius:50%; }
.shape-square.crystal::before { border-radius:18%; }

.crystal.has-texture {
    background:transparent !important;
    background-image:var(--texture) !important;
    background-size:cover !important;
    background-position:center !important;
    background-repeat:no-repeat !important;
}
.crystal.has-texture.shape-drop { background-size:78% 78% !important; }
.crystal.has-texture.shape-vortex { background-size:82% 82% !important; }
.crystal.has-texture.shape-triangle { background-size:82% 82% !important; background-position:center 60% !important; }
.crystal.has-texture.shape-star { background-size:85% 85% !important; }
.crystal.has-texture.shape-diamond { background-size:82% 82% !important; }

.crystal.bomb { animation:bombFloat 1.8s ease-in-out infinite; }
.crystal.bomb::after {
    content:'💥'; position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:min(5vw,26px);
    text-shadow:0 0 12px rgba(255,220,80,1);
    animation:bombPulse 1s ease-in-out infinite;
    z-index:2;
    pointer-events:none;
}
.crystal.bomb.has-texture::before { display:none; }
@keyframes bombFloat {
    0%,100% { transform:scale(1) rotate(0deg); }
    50% { transform:scale(1.06) rotate(3deg); }
}
@keyframes bombPulse {
    0%,100% { transform:scale(1); filter:brightness(1); }
    50% { transform:scale(1.2); filter:brightness(1.6); }
}
.crystal.joker {
    background:linear-gradient(135deg,#ffdd59,#ff6b9d,#a55eea,#70e6ff,#2ed573,#ffdd59);
    background-size:400% 400%;
    animation:jokerShift 4s ease infinite, jokerGlow 1.8s ease-in-out infinite;
    --glow:#ffdd59;
}
.crystal.joker.has-texture {
    background-image:var(--texture) !important;
    background-size:82% 82% !important;
    background-position:center !important;
    background-repeat:no-repeat !important;
}
@keyframes jokerShift { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
@keyframes jokerGlow {
    0%,100% { filter:brightness(1.1) drop-shadow(0 0 10px #ffdd59); }
    50% { filter:brightness(1.4) drop-shadow(0 0 20px #a55eea); }
}

.crystal.stone {
    background:linear-gradient(135deg,#6a6a6a,#2a2a2a,#5a5a5a);
    clip-path:polygon(20% 10%,80% 0%,100% 40%,90% 90%,30% 100%,0% 70%,5% 25%);
    --glow:#5a5a5a;
}
.crystal.stone::after {
    content:''; position:absolute; inset:10%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25),transparent 60%);
    border-radius:inherit;
}
.crystal.stone.has-texture {
    background:transparent !important;
    background-image:var(--texture) !important;
    background-size:cover !important;
    background-position:center !important;
    background-repeat:no-repeat !important;
}
.crystal.stone.has-texture::before,
.crystal.stone.has-texture::after { display:none; }

.crystal.pop { animation:popOut .45s cubic-bezier(.34,1.56,.64,1) forwards; }
@keyframes popOut {
    0% { transform:scale(1) rotate(0deg); opacity:1; }
    40% { transform:scale(1.3) rotate(15deg); opacity:.9; filter:brightness(1.8); }
    100% { transform:scale(0) rotate(45deg); opacity:0; }
}
.crystal.shake { animation:shake .4s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake {
    0%,100% { transform:translateX(0) rotate(0deg); }
    20% { transform:translateX(-6px) rotate(-5deg); }
    40% { transform:translateX(6px) rotate(5deg); }
    60% { transform:translateX(-5px) rotate(-3deg); }
    80% { transform:translateX(5px) rotate(3deg); }
}
.crystal.dragging {
    z-index:100;
    transform:scale(1.15) !important;
    filter:brightness(1.4) drop-shadow(0 0 20px rgba(255,255,255,.9)) !important;
    pointer-events:none;
    transition:none !important;
}
.cell.drag-target {
    background:rgba(140,200,255,.2);
    box-shadow:inset 0 0 0 2px rgba(140,200,255,.7);
}

.explosion-particle {
    position:absolute; width:10px; height:10px; border-radius:50%;
    pointer-events:none; z-index:50;
    will-change: transform, opacity;
}
.explosion-ring {
    position:absolute; border:3px solid; border-radius:50%;
    pointer-events:none; z-index:49;
    animation:ringExpand .6s cubic-bezier(.17,.67,.4,1.2) forwards;
}
@keyframes ringExpand {
    0% { transform:scale(0); opacity:1; }
    100% { transform:scale(3); opacity:0; }
}
.float-score {
    position:absolute; font-weight:900; font-size:20px; pointer-events:none;
    z-index:60; color:#ffdd59;
    text-shadow: 0 0 12px rgba(255,220,0,.9), 0 2px 4px rgba(0,0,0,.9);
    animation:floatUp 1s cubic-bezier(.17,.67,.4,1.1) forwards;
    will-change: transform, opacity;
}
@keyframes floatUp {
    0% { transform:translateY(0) scale(.6); opacity:0; }
    20% { transform:translateY(-10px) scale(1.2); opacity:1; }
    100% { transform:translateY(-55px) scale(1); opacity:0; }
}
.screen-flash {
    position:absolute; inset:0;
    background:radial-gradient(circle,rgba(255,255,255,.6),rgba(200,220,255,.3) 40%,transparent 70%);
    opacity:0; pointer-events:none; z-index:70;
    transition:opacity .15s ease;
}
.screen-flash.active { opacity:1; }
.screen-flash.shake-active { animation:screenShake .35s cubic-bezier(.36,.07,.19,.97); }
@keyframes screenShake {
    0%,100% { transform:translate(0,0); }
    15% { transform:translate(-8px,5px); }
    30% { transform:translate(8px,-5px); }
    45% { transform:translate(-6px,-8px); }
    60% { transform:translate(6px,8px); }
    75% { transform:translate(-3px,-3px); }
}
.board-message {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(20,30,42,.97); color:#c8ddf0; padding:18px 32px;
    border-radius:18px; font-size:15px; font-weight:700; z-index:80;
    border:1px solid rgba(100,160,220,.5);
    box-shadow:0 10px 30px rgba(0,0,0,.6);
    animation:msgAppear .5s cubic-bezier(.34,1.56,.64,1);
    white-space:nowrap;
}
@keyframes msgAppear {
    0% { opacity:0; transform:translate(-50%,-50%) scale(.6); }
    100% { opacity:1; transform:translate(-50%,-50%) scale(1); }
}
.toast {
    position:absolute; bottom:80px; left:50%; transform:translateX(-50%);
    background:rgba(20,30,42,.97); color:#c8ddf0; padding:12px 26px;
    border-radius:32px; font-size:13px; z-index:90;
    border:1px solid rgba(100,160,220,.4);
    box-shadow:0 6px 20px rgba(0,0,0,.5);
    animation:toastIn .35s cubic-bezier(.34,1.56,.64,1);
    white-space:nowrap;
}
@keyframes toastIn {
    0% { opacity:0; transform:translateX(-50%) translateY(20px) scale(.8); }
    100% { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
}

.modal-overlay {
    position:fixed; inset:0; z-index:500;
    background:rgba(0,0,0,.85);
    display:none; align-items:center; justify-content:center;
    padding:16px;
}
.modal-overlay.active { display:flex; }
.modal {
    background:#151e2a; border-radius:24px; padding:24px;
    max-width:620px; width:100%; max-height:90vh; overflow-y:auto;
    border:1px solid rgba(100,160,220,.4);
    box-shadow:0 20px 60px rgba(0,0,0,.8);
}
.modal h2 { color:#d6e6ff; font-size:20px; margin-bottom:6px; text-align:center; }
.modal .modal-sub { color:#7c9ab9; font-size:12px; text-align:center; margin-bottom:18px; }

    currentLang = lang;

}

    try {
        const saved = localStorage.getItem('crystalz_lang');
        if(saved && TRANSLATIONS[saved]) currentLang = saved;
        else {
            const nav = (navigator.language || 'ru').slice(0,2).toLowerCase();
            currentLang = TRANSLATIONS[nav] ? nav : 'ru';

const TEX_KEY = 'crystalz_textures_v2';
const ATMO_KEY = 'crystalz_atmo';
const MUSIC_KEY = 'crystalz_music';

function loadProgress(){
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return;
        const data = JSON.parse(raw);
        if(typeof data.bestScore === 'number') state.bestScore = data.bestScore;
        if(typeof data.gamesPlayed === 'number') state.gamesPlayed = data.gamesPlayed;
    } catch(e){}
}
function saveProgress(){
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            bestScore: state.bestScore, gamesPlayed: state.gamesPlayed,
            savedAt: new Date().toISOString(),
        }));
    } catch(e){}
}
function loadAtmo(){
    try {
        const raw = localStorage.getItem(ATMO_KEY);
        if(!raw) return;
        const data = JSON.parse(raw);
        if(data.season) state.manualSeason = data.season;
        if(data.weather) state.manualWeather = data.weather;
    } catch(e){}
}
function saveAtmo(){
    try {
        localStorage.setItem(ATMO_KEY, JSON.stringify({
            season: state.manualSeason, weather: state.manualWeather,
        }));
    } catch(e){}
}
function loadTextures(){
    try {
        const raw = localStorage.getItem(TEX_KEY);
        if(!raw) return;
        const data = JSON.parse(raw);
        if(Array.isArray(data.textures)){
            for(let i = 0; i < TOTAL_TEXTURE_SLOTS; i++){
                state.textures[i] = data.textures[i] || null;
            }

}
function saveTextures(){

}

    init(){
        if(this.ctx) return;
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if(!AudioCtx) return;
            this.ctx = new AudioCtx();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0;
            // Общий фильтр — убираем возможную резкость
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 3500;
            filter.Q.value = 0.5;
            // Delay-эффект для «эха» — как в пещере кристаллов
            const delay = this.ctx.createDelay();
            delay.delayTime.value = 0.35;
            const feedback = this.ctx.createGain();
            feedback.gain.value = 0.25;
            const delayGain = this.ctx.createGain();
            delayGain.gain.value = 0.35;
            // Маршрут: master → filter → destination
            // И параллельно: master → delayGain → delay → feedback → delay (loop) → destination
            this.masterGain.connect(filter);
            filter.connect(this.ctx.destination);
            filter.connect(delayGain);
            delayGain.connect(delay);
            delay.connect(feedback);
            feedback.connect(delay);
            delay.connect(this.ctx.destination);
        } catch(e){
            console.warn('Music init error', e);
        }
    },

    // Колокольчик — быстрый attack, длинный decay, чистый тембр
    playBell(freq, time, duration, volume){
        if(!this.ctx) return;
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const g2 = this.ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.value = freq;
        osc2.type = 'sine';
        osc2.frequency.value = freq * 2.01; // чуть выше октавы — колокольчиковый обертон
        g2.gain.value = 0.25;
        // ADSR: мгновенная атака, плавный спад
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(volume, time + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
        osc1.connect(gain);
        osc2.connect(g2);
        g2.connect(gain);
        gain.connect(this.masterGain);
        osc1.start(time);
        osc2.start(time);
        osc1.stop(time + duration + 0.1);
        osc2.stop(time + duration + 0.1);
    },

    // Мягкая бас-нота
    playBass(freq, time, duration){
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.09, time + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start(time);
        osc.stop(time + duration + 0.1);
    },

    scheduleNote(){
        if(!this.isPlaying || !this.ctx) return;
        const now = this.ctx.currentTime;

        // === Мелодия ===
        // Двигаемся по шкале вверх или вниз, иногда прыгаем
        if(Math.random() < 0.15){
            // Случайный прыжок
            this.step = Math.floor(Math.random() * this.scale.length);
        } else {
            // Плавное движение
            this.step += this.direction;
            if(this.step >= this.scale.length - 1){
                this.step = this.scale.length - 2;
                this.direction = -1;
            } else if(this.step <= 0){
                this.step = 1;
                this.direction = 1;
            }
            // Иногда меняем направление
            if(Math.random() < 0.3) this.direction *= -1;
        }

        const freq = this.scale[this.step];
        const dur = 0.9 + Math.random() * 0.8;
        const vol = 0.14 + Math.random() * 0.06;
        this.playBell(freq, now, dur, vol);

        // Иногда вторая нота с задержкой — «переливы»
        if(Math.random() < 0.3){
            const idx2 = Math.max(0, Math.min(this.scale.length - 1,
                this.step + (Math.random() < 0.5 ? 1 : -1)));
            const freq2 = this.scale[idx2];
            this.playBell(freq2, now + 0.3, 0.7, vol * 0.7);
        }

        // === Аккомпанемент ===
        // Бас каждые 4 ноты
        if(this.step % 4 === 0){
            const bassIdx = Math.floor((this.step / 4) % this.bassLine.length);
            this.playBass(this.bassLine[bassIdx], now, 2.5);
        }

        this.nextNoteTime = now + this.tempo + Math.random() * 0.4;
    },

    start(){
        this.init();
        if(!this.ctx || this.isPlaying) return;
        if(this.ctx.state === 'suspended') this.ctx.resume();
        this.isPlaying = true;
        this.step = Math.floor(Math.random() * 4) + 2; // средний регистр
        this.direction = Math.random() < 0.5 ? 1 : -1;
        this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);
        this.masterGain.gain.linearRampToValueAtTime(0.5, this.ctx.currentTime + 2.5);
        const tick = () => {
            if(!this.isPlaying) return;
            if(this.ctx.currentTime >= this.nextNoteTime){
                this.scheduleNote();
            }
            this.timerId = setTimeout(tick, 150);
        };
        this.nextNoteTime = this.ctx.currentTime;
        tick();
    },

    stop(){
        if(!this.ctx || !this.isPlaying) return;
        this.isPlaying = false;
        this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);
        this.masterGain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1.8);
        if(this.timerId){
            clearTimeout(this.timerId);
            this.timerId = null;
        }
    },

    toggle(){
        if(this.isPlaying) this.stop();
        else this.start();
        return this.isPlaying;
    },
};

function getSeason(){
    if(state.manualSeason) return state.manualSeason;
    const m = new Date().getMonth();
    if(m === 11 || m <= 1) return 'winter';
    if(m <= 4) return 'spring';
    if(m <= 7) return 'summer';
    return 'autumn';
}
function getTimeOfDay(){
    const h = new Date().getHours();
    if(h >= 5 && h < 12) return 'morning';
    if(h >= 12 && h < 17) return 'day';
    if(h >= 17 && h < 22) return 'evening';
    return 'night';
}
function getWeather(){
    if(state.manualWeather) return state.manualWeather;
    const s = getSeason();
    let pool = ['clear','clear','clear','rain','rain','snow','snow','cloudy','cloudy'];
    if(s === 'winter') pool = ['snow','snow','snow','cloudy','cloudy','clear','clear','rain'];
    if(s === 'summer') pool = ['clear','clear','clear','clear','cloudy','cloudy','rain','rain'];
    if(s === 'autumn') pool = ['rain','rain','rain','cloudy','cloudy','clear','clear'];
    if(s === 'spring') pool = ['rain','rain','cloudy','cloudy','clear','clear','clear'];
    const daySeed = Math.floor(Date.now() / (1000*60*60*6));
    const idx = Math.abs(Math.sin(daySeed) * 10000) % pool.length;
    return pool[Math.floor(idx)];
}

function updateAtmosphereLabels(){
    const season = getSeason();
    const time = getTimeOfDay();
    const weather = getWeather();
    seasonLabel.textContent = t('season_' + season);
    timeLabel.textContent = t('time_' + time);
    weatherLabel.textContent = t('weather_' + weather);

    document.querySelectorAll('#seasonBtns .atmo-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.season === season);
    });
    document.querySelectorAll('#weatherBtns .atmo-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.weather === weather);
        if(b.dataset.weather === 'snow'){
            b.disabled = (season !== 'winter');
        }
    });
}
function renderWeatherLayer(){
    if(!weatherLayer) return;
    if(state.gameActive){ weatherLayer.innerHTML = ''; return; }
    const weather = getWeather();
    weatherLayer.innerHTML = '';
    if(weather === 'rain'){
        for(let i = 0; i < 25; i++){
            const d = document.createElement('div');
            d.className = 'rain-drop';
            d.style.left = Math.random()*100 + '%';
            d.style.height = (10 + Math.random()*20) + 'px';
            d.style.animationDuration = (0.4 + Math.random()*0.5) + 's';
            d.style.animationDelay = (Math.random()*2) + 's';
            weatherLayer.appendChild(d);
        }
    } else if(weather === 'snow'){
        for(let i = 0; i < 18; i++){
            const f = document.createElement('div');
            f.className = 'snow-flake';
            f.textContent = '❄';
            f.style.left = Math.random()*100 + '%';
            f.style.fontSize = (8 + Math.random()*10) + 'px';
            f.style.animationDuration = (5 + Math.random()*5) + 's';
            f.style.animationDelay = (Math.random()*5) + 's';
            weatherLayer.appendChild(f);
        }
    } else if(weather === 'cloudy'){
        for(let i = 0; i < 3; i++){
            const c = document.createElement('div');
            c.className = 'cloud';
            c.style.width = (120 + Math.random()*180) + 'px';
            c.style.height = (60 + Math.random()*80) + 'px';
            c.style.top = (Math.random()*40) + '%';
            c.style.animationDuration = (30 + Math.random()*40) + 's';
            c.style.animationDelay = (Math.random()*20) + 's';
            weatherLayer.appendChild(c);
        }
    }
}
function applyMenuAtmosphere(){
    const season = getSeason();
    const time = getTimeOfDay();
    document.body.className = 'season-' + season;
    menuEl.className = 'time-' + time;
    if(menuEl.classList.contains('hidden')) menuEl.classList.add('hidden');
    updateAtmosphereLabels();
    renderWeatherLayer();
}

//  ГЕНЕРАЦИЯ ПОЛЯ
// ============================================================
function randCrystal(){
    const idx = Math.floor(Math.random() * CRYSTALS.length);
    const c = {
        type:'crystal', colorIdx: idx,
        shape: CRYSTALS[idx].shape, css: CRYSTALS[idx].css,
        isBomb: false, isJoker: false,
    };
    const roll = Math.random();
    if(roll < 0.015) c.isBomb = true;
    else if(roll < 0.025) c.isJoker = true;
    return c;
}
function randStone(){ return { type:'stone' }; }
function createEmptyGrid(){ return Array.from({length:ROWS}, () => Array(COLS).fill(null)); }

function wouldMatch(grid, r, c, colorIdx){
    let count = 1;
    for(let i = c-1; i >= 0 && grid[r][i] && grid[r][i].type === 'crystal' && grid[r][i].colorIdx === colorIdx; i--) count++;
    for(let i = c+1; i < COLS && grid[r][i] && grid[r][i].type === 'crystal' && grid[r][i].colorIdx === colorIdx; i++) count++;
    if(count >= 3) return true;
    count = 1;
    for(let i = r-1; i >= 0 && grid[i][c] && grid[i][c].type === 'crystal' && grid[i][c].colorIdx === colorIdx; i--) count++;
    for(let i = r+1; i < ROWS && grid[i][c] && grid[i][c].type === 'crystal' && grid[i][c].colorIdx === colorIdx; i++) count++;
    if(count >= 3) return true;
    return false;
}

function generateGrid(mode){
    const grid = createEmptyGrid();
    for(let r = 0; r < ROWS; r++){
        for(let c = 0; c < COLS; c++){
            let attempts = 0;
            let cell;
            do {
                cell = randCrystal();
                attempts++;
            } while(attempts < 50 && wouldMatch(grid, r, c, cell.colorIdx));
            grid[r][c] = cell;
        }
    }
    if(mode === 'stones'){
        const stoneCount = 4 + Math.floor(Math.random() * 3);
        let placed = 0, guard = 0;
        while(placed < stoneCount && guard < 500){
            guard++;
            const r = Math.floor(Math.random()*ROWS);
            const c = Math.floor(Math.random()*COLS);
            if(grid[r][c] && grid[r][c].type === 'crystal'){
                grid[r][c] = randStone();
                placed++;
            }
        }
    }
    return grid;
}

// ============================================================
//  ЛОГИКА МАТЧЕЙ
// ============================================================
function findMatches(grid){
    const matches = [];
    for(let r = 0; r < ROWS; r++){
        let c = 0;
        while(c < COLS){
            const cell = grid[r][c];
            if(cell && cell.type === 'crystal' && !cell.isJoker){
                const color = cell.colorIdx;
                let end = c + 1;
                while(end < COLS){
                    const nxt = grid[r][end];
                    if(nxt && nxt.type === 'crystal' && !nxt.isJoker && nxt.colorIdx === color) end++;
                    else break;
                }
                const len = end - c;
                if(len >= 3){
                    const cells = [];
                    for(let i = c; i < end; i++) cells.push({r, c:i});
                    matches.push({ cells, colorIdx:color, length:len, isHorizontal:true });
                }
                c = end;
            } else c++;
        }
    }
    for(let c = 0; c < COLS; c++){
        let r = 0;
        while(r < ROWS){
            const cell = grid[r][c];
            if(cell && cell.type === 'crystal' && !cell.isJoker){
                const color = cell.colorIdx;
                let end = r + 1;
                while(end < ROWS){
                    const nxt = grid[end][c];
                    if(nxt && nxt.type === 'crystal' && !nxt.isJoker && nxt.colorIdx === color) end++;
                    else break;
                }
                const len = end - r;
                if(len >= 3){
                    const cells = [];
                    for(let i = r; i < end; i++) cells.push({r:i, c});
                    matches.push({ cells, colorIdx:color, length:len, isHorizontal:false });
                }
                r = end;
            } else r++;
        }
    }
    return matches;
}

function hasPossibleMove(grid){
    for(let r = 0; r < ROWS; r++){
        for(let c = 0; c < COLS; c++){
            const a = grid[r][c];
            if(!a || a.type !== 'crystal' || a.isJoker) continue;
            if(c+1 < COLS){
                const b = grid[r][c+1];
                if(b && b.type === 'crystal' && !b.isJoker){
                    swapCells(grid, r, c, r, c+1);
                    if(findMatches(grid).length > 0){ swapCells(grid, r, c, r, c+1); return true; }
                    swapCells(grid, r, c, r, c+1);
                }
            }
            if(r+1 < ROWS){
                const b = grid[r+1][c];
                if(b && b.type === 'crystal' && !b.isJoker){
                    swapCells(grid, r, c, r+1, c);
                    if(findMatches(grid).length > 0){ swapCells(grid, r, c, r+1, c); return true; }
                    swapCells(grid, r, c, r+1, c);
                }
            }
        }
    }
    return false;
}
function swapCells(grid, r1, c1, r2, c2){
    const tmp = grid[r1][c1];
    grid[r1][c1] = grid[r2][c2];
    grid[r2][c2] = tmp;
}
function activateJoker(grid, r, c){
    const cell = grid[r][c];
    if(!cell || !cell.isJoker) return [];
    const targetColor = Math.floor(Math.random() * CRYSTALS.length);
    const cleared = [];
    for(let i = 0; i < ROWS; i++){
        for(let j = 0; j < COLS; j++){
            const cc = grid[i][j];
            if(cc && cc.type === 'crystal' && cc.colorIdx === targetColor && !cc.isJoker){
                cleared.push({r:i, c:j, colorIdx:targetColor});
            }
        }
    }
    cleared.push({r, c, colorIdx:targetColor, isJoker:true});
    return cleared;
}
function getBombBlastCells(grid, r, c){
    const cells = [];
    for(let i = r-1; i <= r+1; i++){
        for(let j = c-1; j <= c+1; j++){
            if(i >= 0 && i < ROWS && j >= 0 && j < COLS){
                if(grid[i][j]) cells.push({r:i, c:j});
            }
        }
    }
    return cells;
}

//  RENDER
// ============================================================
let cellSize = 40;
let cellGap = 3;

function getCellEl(r, c){
    return boardEl.children[r * COLS + c] || null;
}

function renderBoard(){
    const wrap = boardEl.parentElement;
    const wrapW = wrap.clientWidth - 16;
    const wrapH = wrap.clientHeight - 16;
    const maxCellW = Math.floor(wrapW / COLS) - 3;
    const maxCellH = Math.floor(wrapH / ROWS) - 3;
    cellSize = Math.max(28, Math.min(maxCellW, maxCellH, 68));
    cellGap = Math.max(2, Math.floor(cellSize * 0.06));

    boardEl.style.gridTemplateColumns = `repeat(${COLS}, ${cellSize}px)`;
    boardEl.style.gridTemplateRows = `repeat(${ROWS}, ${cellSize}px)`;
    boardEl.style.gap = cellGap + 'px';

    const fragment = document.createDocumentFragment();
    for(let r = 0; r < ROWS; r++){
        for(let c = 0; c < COLS; c++){
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.r = r;
            cell.dataset.c = c;
            cell.style.width = cellSize + 'px';
            cell.style.height = cellSize + 'px';
            if(state.selected && state.selected.r === r && state.selected.c === c){
                cell.classList.add('selected');
            }
            const data = state.grid[r][c];
            if(data){
                const crystal = createCrystalEl(data, cellSize);
                crystal.dataset.r = r;
                crystal.dataset.c = c;
                cell.appendChild(crystal);
            }
            fragment.appendChild(cell);
        }
    }
    boardEl.innerHTML = '';
    boardEl.appendChild(fragment);
}

function updateCell(r, c){
    const cell = getCellEl(r, c);
    if(!cell) return;
    cell.innerHTML = '';
    const data = state.grid[r][c];
    if(data){
        const crystal = createCrystalEl(data, cellSize);
        crystal.dataset.r = r;
        crystal.dataset.c = c;
        cell.appendChild(crystal);
    }
    if(state.selected && state.selected.r === r && state.selected.c === c){
        cell.classList.add('selected');
    } else {
        cell.classList.remove('selected');
    }
}

function updateSelection(){
    const prev = boardEl.querySelector('.cell.selected');
    if(prev) prev.classList.remove('selected');
    if(state.selected){
        const cell = getCellEl(state.selected.r, state.selected.c);
        if(cell) cell.classList.add('selected');
    }
}

function createCrystalEl(data, cellSize){
    const el = document.createElement('div');
    el.className = 'crystal';
    if(data.type === 'stone'){
        el.classList.add('stone');
        el.classList.add('shape-hexagon');
        if(state.textures[STONE_SLOT]){
            el.style.setProperty('--texture', `url(${state.textures[STONE_SLOT]})`);
            el.classList.add('has-texture');
        }
    } else {
        el.classList.add('shape-' + data.shape);
        el.classList.add(data.css);
        if(data.isBomb) el.classList.add('bomb');
        if(data.isJoker){
            el.classList.add('joker');
            el.classList.add('shape-' + JOKER_SHAPE);
        }
        let texIdx = data.isJoker ? JOKER_SLOT : data.colorIdx;
        const tex = state.textures[texIdx];
        if(tex){
            el.style.setProperty('--texture', `url(${tex})`);
            el.classList.add('has-texture');
        }
        el.classList.add('lit');
        if(data.color === 'white') el.classList.add('lit-bright');
    }
    el.style.fontSize = Math.floor(cellSize * 0.5) + 'px';
    return el;
}

function updateHUD(){
    scoreVal.textContent = state.score;
    bestScoreEl.textContent = state.bestScore;
    gamesPlayedEl.textContent = state.gamesPlayed;
}

// ============================================================
//  ВЗАИМОДЕЙСТВИЕ
// ============================================================
let dragState = null;
let dragEl = null;

function getCellFromPoint(x, y){
    const el = document.elementFromPoint(x, y);
    if(!el) return null;
    const cell = el.closest('.cell');
    if(!cell) return null;
    return { r: +cell.dataset.r, c: +cell.dataset.c, el: cell };
}
function clearDragTargets(){
    document.querySelectorAll('.cell.drag-target').forEach(el => el.classList.remove('drag-target'));
}
function clearDragging(){
    if(dragEl){
        dragEl.classList.remove('dragging');
        dragEl.style.left = '';
        dragEl.style.top = '';
        dragEl.style.width = '';
        dragEl.style.height = '';
        dragEl.style.position = '';
        dragEl = null;
    }
}

boardEl.addEventListener('mousedown', e => {
    if(state.animating || !state.gameActive) return;
    const cell = e.target.closest('.cell');
    if(!cell) return;
    e.preventDefault();
    startDrag(+cell.dataset.r, +cell.dataset.c, e.clientX, e.clientY);
});
document.addEventListener('mousemove', e => {
    if(!dragState) return;
    e.preventDefault();
    moveDrag(e.clientX, e.clientY);
});
document.addEventListener('mouseup', e => {
    if(!dragState) return;
    e.preventDefault();
    endDrag(e.clientX, e.clientY);
});
boardEl.addEventListener('touchstart', e => {
    if(state.animating || !state.gameActive) return;
    const cell = e.target.closest('.cell');
    if(!cell) return;
    const touch = e.touches[0];
    startDrag(+cell.dataset.r, +cell.dataset.c, touch.clientX, touch.clientY);
}, {passive:true});
document.addEventListener('touchmove', e => {
    if(!dragState) return;
    const touch = e.touches[0];
    moveDrag(touch.clientX, touch.clientY);
    if(Math.abs(touch.clientX - dragState.startX) > 8 || Math.abs(touch.clientY - dragState.startY) > 8){
        e.preventDefault();
    }
}, {passive:false});
document.addEventListener('touchend', e => {
    if(!dragState) return;
    const touch = e.changedTouches[0];
    endDrag(touch.clientX, touch.clientY);
}, {passive:true});
document.addEventListener('touchcancel', () => {
    if(dragState) cancelDrag();
});

function startDrag(r, c, x, y){
    const data = state.grid[r][c];
    if(!data) return;
    if(data.type === 'crystal' && data.isJoker && !state.selected){ triggerJoker(r, c); return; }
    if(data.type === 'stone'){ showToast(t('toast_stoneMove')); return; }
    dragState = { r, c, startX:x, startY:y, moved:false, targetR:r, targetC:c };
    const cell = getCellEl(r, c);
    if(cell){
        const cr = cell.querySelector('.crystal');
        if(cr){
            dragEl = cr;
            cr.classList.add('dragging');
            const rect = cell.getBoundingClientRect();
            cr.style.position = 'fixed';
            cr.style.width = rect.width + 'px';
            cr.style.height = rect.height + 'px';
            cr.style.left = (rect.left + (rect.width - cellSize*0.88)/2) + 'px';
            cr.style.top = (rect.top + (rect.height - cellSize*0.88)/2) + 'px';
            cr.style.zIndex = 1000;
        }
    }
}
function moveDrag(x, y){
    if(!dragState) return;
    const dx = x - dragState.startX;
    const dy = y - dragState.startY;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) dragState.moved = true;
    if(dragEl){
        const offset = cellSize * 0.44;
        dragEl.style.left = (x - offset) + 'px';
        dragEl.style.top = (y - offset) + 'px';
    }
    const target = getCellFromPoint(x, y);
    clearDragTargets();
    if(target && (target.r !== dragState.r || target.c !== dragState.c)){
        const dist = Math.abs(target.r - dragState.r) + Math.abs(target.c - dragState.c);
        if(dist === 1){
            dragState.targetR = target.r;
            dragState.targetC = target.c;
            target.el.classList.add('drag-target');
        } else {
            dragState.targetR = dragState.r;
            dragState.targetC = dragState.c;
        }
    } else {
        dragState.targetR = dragState.r;
        dragState.targetC = dragState.c;
    }
}
function endDrag(x, y){
    if(!dragState) return;
    const d = dragState;
    clearDragTargets();
    clearDragging();
    const dx = x - d.startX;
    const dy = y - d.startY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(d.moved && dist > 15){
        let dr = 0, dc = 0;
        if(Math.abs(dx) > Math.abs(dy)) dc = dx > 0 ? 1 : -1;
        else dr = dy > 0 ? 1 : -1;
        const nr = d.r + dr;
        const nc = d.c + dc;
        if(nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS){
            dragState = null;
            handleSwap(d.r, d.c, nr, nc);
            return;
        }
    }
    dragState = null;
    handleCellTap(d.r, d.c);
}
function cancelDrag(){
    dragState = null;
    clearDragTargets();
    clearDragging();
    state.selected = null;
    updateSelection();
}
function handleCellTap(r, c){
    const data = state.grid[r][c];
    if(!data) return;
    if(data.type === 'crystal' && data.isJoker && !state.selected){ triggerJoker(r, c); return; }
    if(data.type === 'stone') return;
    if(!state.selected){
        state.selected = {r, c};
        updateSelection();
        return;
    }
    const sr = state.selected.r, sc = state.selected.c;
    if(sr === r && sc === c){
        state.selected = null;
        updateSelection();
        return;
    }
    if(Math.abs(sr - r) + Math.abs(sc - c) === 1){
        handleSwap(sr, sc, r, c);
    } else {
        state.selected = {r, c};
        updateSelection();
    }
}

// ============================================================
//  МЕХАНИКА ХОДА
// ============================================================
async function handleSwap(r1, c1, r2, c2){
    if(state.animating) return;
    state.animating = true;
    state.selected = null;
    updateSelection();

    const a = state.grid[r1][c1];
    const b = state.grid[r2][c2];
    if(!a || !b) { state.animating = false; return; }
    if(a.type === 'stone' || b.type === 'stone'){
        state.animating = false;
        showToast(t('toast_stoneMove'));
        return;
    }

    const cellAEl = getCellEl(r1, c1);
    const cellBEl = getCellEl(r2, c2);
    const elA = cellAEl ? cellAEl.querySelector('.crystal') : null;
    const elB = cellBEl ? cellBEl.querySelector('.crystal') : null;

    if(elA && elB){
        const dx = (c2 - c1) * (cellSize + cellGap);
        const dy = (r2 - r1) * (cellSize + cellGap);
        elA.classList.add('animating');
        elB.classList.add('animating');
        elA.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
        elB.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
        elA.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
        elB.style.transform = `translate3d(${-dx}px, ${-dy}px, 0)`;
        elA.style.zIndex = '5';
        elB.style.zIndex = '5';
        await sleep(280);
        elA.style.transition = '';
        elB.style.transition = '';
        elA.style.zIndex = '';
        elB.style.zIndex = '';
    }

    swapCells(state.grid, r1, c1, r2, c2);
    state.lastSwapped = [
        {r:r1, c:c1, data: state.grid[r1][c1]},
        {r:r2, c:c2, data: state.grid[r2][c2]},
    ];
    updateCell(r1, c1);
    updateCell(r2, c2);

    const newElA = getCellEl(r1, c1)?.querySelector('.crystal');
    const newElB = getCellEl(r2, c2)?.querySelector('.crystal');
    if(newElA) newElA.classList.remove('animating');
    if(newElB) newElB.classList.remove('animating');

    await sleep(30);
    const matches = findMatches(state.grid);
    if(matches.length === 0){
        const rcA = getCellEl(r1, c1)?.querySelector('.crystal');
        const rcB = getCellEl(r2, c2)?.querySelector('.crystal');
        if(rcA && rcB){
            const dx = (c1 - c2) * (cellSize + cellGap);
            const dy = (r1 - r2) * (cellSize + cellGap);
            rcA.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
            rcB.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
            rcA.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
            rcB.style.transform = `translate3d(${-dx}px, ${-dy}px, 0)`;
            await sleep(280);
        }
        swapCells(state.grid, r1, c1, r2, c2);
        state.lastSwapped = null;
        updateCell(r1, c1);
        updateCell(r2, c2);
        const shakeA = getCellEl(r1, c1)?.querySelector('.crystal');
        const shakeB = getCellEl(r2, c2)?.querySelector('.crystal');
        if(shakeA){ shakeA.classList.add('shake'); setTimeout(()=>shakeA.classList.remove('shake'), 400); }
        if(shakeB){ shakeB.classList.add('shake'); setTimeout(()=>shakeB.classList.remove('shake'), 400); }
        await sleep(400);
        state.animating = false;
        return;
    }
    const cellA = state.grid[r1][c1];
    const cellB = state.grid[r2][c2];
    if(cellA && cellA.isJoker){ await triggerJoker(r1, c1); }
    else if(cellB && cellB.isJoker){ await triggerJoker(r2, c2); }
    else { await resolveMatches(matches); }
    state.lastSwapped = null;
    state.animating = false;
    if(!hasPossibleMove(state.grid)) await autoReshuffle();
}

async function triggerJoker(r, c){
    const cell = state.grid[r][c];
    if(!cell || !cell.isJoker) return;
    const cleared = activateJoker(state.grid, r, c);
    if(cleared.length === 0){
        state.grid[r][c] = null;
        updateCell(r, c);
        return;
    }
    screenFlash.classList.add('active');
    setTimeout(()=>screenFlash.classList.remove('active'), 250);
    await explodeCells(cleared, r, c, true);
}

async function explodeCells(cells, originR, originC, isJoker){
    const toRemove = [];
    for(const {r, c} of cells){
        if(r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
        const data = state.grid[r][c];
        if(!data) continue;
        toRemove.push({r, c});
        const cr = getCellEl(r, c)?.querySelector('.crystal');
        if(cr) cr.classList.add('pop');
    }
    const originEl = getCellCenter(originR, originC);
    if(originEl){
        const isBig = isJoker || cells.length > 5;
        spawnExplosion(originEl.x, originEl.y, isBig ? '#ffdd59' : '#70e6ff', isBig ? 20 : 12);
    }
    let points = 0;
    for(const {r, c} of toRemove){
        const d = state.grid[r][c];
        if(!d) continue;
        if(d.type === 'stone') points += 50;
        else if(d.isJoker) points += 200;
        else if(d.isBomb) points += 100;
        else points += 20;
    }
    addScore(points, originR, originC);
    await sleep(450);
    for(const {r, c} of toRemove) state.grid[r][c] = null;
    await applyGravityAndRefill();
    await sleep(150);
    const newMatches = findMatches(state.grid);
    if(newMatches.length > 0) await resolveMatches(newMatches);
}

function getCellCenter(r, c){
    const cell = getCellEl(r, c);
    if(!cell) return null;
    const rect = cell.getBoundingClientRect();
    const boardRect = boardEl.getBoundingClientRect();
    return { x: rect.left - boardRect.left + rect.width/2, y: rect.top - boardRect.top + rect.height/2 };
}
function spawnExplosion(x, y, color, count){
    for(let i = 0; i < count; i++){
        const p = document.createElement('div');
        p.className = 'explosion-particle';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.background = color;
        p.style.boxShadow = `0 0 12px ${color}`;
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
        const dist = 40 + Math.random() * 70;
        p.style.transition = 'transform .65s cubic-bezier(.17,.67,.4,1.1), opacity .65s';
        boardEl.appendChild(p);
        requestAnimationFrame(() => {
            p.style.transform = `translate3d(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px, 0) scale(0)`;
            p.style.opacity = '0';
        });
        setTimeout(() => p.remove(), 680);
    }
    const ring = document.createElement('div');
    ring.className = 'explosion-ring';
    ring.style.left = (x - 25) + 'px';
    ring.style.top = (y - 25) + 'px';
    ring.style.width = '50px';
    ring.style.height = '50px';
    ring.style.borderColor = color;
    ring.style.boxShadow = `0 0 20px ${color}`;
    boardEl.appendChild(ring);
    setTimeout(() => ring.remove(), 650);
    screenFlash.classList.add('shake-active');
    setTimeout(() => screenFlash.classList.remove('shake-active'), 400);
}
function addScore(points, r, c){
    state.score += points;
    if(state.score > state.bestScore) state.bestScore = state.score;
    updateHUD();
    saveProgress();
    const pos = getCellCenter(r, c);
    if(pos){
        const el = document.createElement('div');
        el.className = 'float-score';
        el.textContent = '+' + points;
        el.style.left = (pos.x - 25) + 'px';
        el.style.top = (pos.y - 20) + 'px';
        boardEl.appendChild(el);
        setTimeout(() => el.remove(), 1050);
    }
}

// ============================================================
//  РАЗРЕШЕНИЕ МАТЧЕЙ — с ФИКСОМ джокера
// ============================================================
async function resolveMatches(matches){
    const toRemove = new Set();
    const specials = [];
    const bombsInLines = [];

    for(const m of matches){
        const cells = m.cells;
        for(const {r, c} of cells){
            const d = state.grid[r][c];
            if(d && d.isBomb) bombsInLines.push({r, c});
        }
        if(cells.length >= 5){
            const mid = cells[Math.floor(cells.length/2)];
            specials.push({ r: mid.r, c: mid.c, type:'joker' });
            for(const {r,c} of cells){
                if(r === mid.r && c === mid.c) continue;
                toRemove.add(r + ',' + c);
            }
        } else if(cells.length === 4){
            let newBombPos = null;
            if(state.lastSwapped){
                for(const sw of state.lastSwapped){
                    if(cells.some(cc => cc.r === sw.r && cc.c === sw.c)){
                        newBombPos = { r: sw.r, c: sw.c };
                        break;
                    }
                }
            }
            if(!newBombPos) newBombPos = { r: cells[1].r, c: cells[1].c };
            specials.push({ r: newBombPos.r, c: newBombPos.c, type:'bomb', colorIdx: m.colorIdx });
            for(const {r,c} of cells){
                if(r === newBombPos.r && c === newBombPos.c) continue;
                toRemove.add(r + ',' + c);
            }
        } else {
            for(const {r,c} of cells) toRemove.add(r + ',' + c);
        }
    }
    for(const bp of bombsInLines){
        toRemove.delete(bp.r + ',' + bp.c);
    }

    for(const key of toRemove){
        const [r, c] = key.split(',').map(Number);
        const cr = getCellEl(r, c)?.querySelector('.crystal');
        if(cr) cr.classList.add('pop');
    }
    let points = 0;
    for(const key of toRemove){
        const [r, c] = key.split(',').map(Number);
        const d = state.grid[r][c];
        if(d && d.type === 'stone') points += 50;
        else if(d) points += 20;
    }
    if(points > 0 && toRemove.size > 0){
        const first = toRemove.values().next().value;
        const [fr, fc] = first.split(',').map(Number);
        addScore(points, fr, fc);
    }
    await sleep(450);

    for(const key of toRemove){
        const [r, c] = key.split(',').map(Number);
        state.grid[r][c] = null;
    }

    for(const bp of bombsInLines){
        const cell = state.grid[bp.r] && state.grid[bp.r][bp.c];
        if(!cell || !cell.isBomb) continue;
        cell.isBomb = false;
        const blast = getBombBlastCells(state.grid, bp.r, bp.c);
        for(const {r, c} of blast){
            const cr = getCellEl(r, c)?.querySelector('.crystal');
            if(cr) cr.classList.add('pop');
        }
        const originEl = getCellCenter(bp.r, bp.c);
        if(originEl) spawnExplosion(originEl.x, originEl.y, '#ffdd59', 20);
        await sleep(320);
        let blastPoints = 0;
        for(const {r, c} of blast){
            const d = state.grid[r][c];
            if(!d) continue;
            if(d.type === 'stone') blastPoints += 50;
            else if(d.isJoker) blastPoints += 200;
            else if(d.isBomb && !(r === bp.r && c === bp.c)) blastPoints += 100;
            else blastPoints += 20;
        }
        if(blastPoints > 0) addScore(blastPoints, bp.r, bp.c);
        for(const {r, c} of blast) state.grid[r][c] = null;
        await sleep(80);
    }

    // === ФИКС: ставим спец-кристаллы и СРАЗУ обновляем DOM ===
    for(const s of specials){
        const target = state.grid[s.r] && state.grid[s.r][s.c];
        if(target && target.type === 'crystal' && !target.isBomb && !target.isJoker){
            if(s.type === 'bomb'){
                target.isBomb = true;
            } else {
                target.isJoker = true;
                target.isBomb = false;
                // ВАЖНО: джокер должен стать "вихрем", а не остаться прежней формой
                target.shape = JOKER_SHAPE;
            }
        } else if(!target){
            const base = randCrystal();
            if(s.type === 'bomb'){
                base.isBomb = true;
            } else {
                base.isJoker = true;
                base.isBomb = false;
                base.shape = JOKER_SHAPE;
            }
            state.grid[s.r][s.c] = base;
        }
        // Обновляем DOM для этой клетки — теперь текстура джокера применится
        updateCell(s.r, s.c);
    }

    await applyGravityAndRefill();
    await sleep(200);
    const newMatches = findMatches(state.grid);
    if(newMatches.length > 0) await resolveMatches(newMatches);
}

async function applyGravityAndRefill(){
    const fallMap = {};
    for(let c = 0; c < COLS; c++){
        let writeRow = ROWS - 1;
        for(let r = ROWS - 1; r >= 0; r--){
            if(state.grid[r][c]){
                if(writeRow !== r){
                    state.grid[writeRow][c] = state.grid[r][c];
                    state.grid[r][c] = null;
                    fallMap[writeRow + ',' + c] = writeRow - r;
                }
                writeRow--;
            }
        }
        for(let r = writeRow; r >= 0; r--){
            state.grid[r][c] = randCrystal();
            fallMap[r + ',' + c] = writeRow + 1;
        }
    }
    for(const key in fallMap){
        const [r, c] = key.split(',').map(Number);
        updateCell(r, c);
    }
    for(const key in fallMap){
        const [r, c] = key.split(',').map(Number);
        const cr = getCellEl(r, c)?.querySelector('.crystal');
        if(cr){
            const dist = fallMap[key] * (cellSize + cellGap);
            cr.style.transform = `translate3d(0, ${-dist}px, 0)`;
            cr.style.transition = 'none';
            cr.style.opacity = '0.4';
            requestAnimationFrame(() => {
                cr.style.transition = 'transform .4s cubic-bezier(.34,1.56,.64,1), opacity .3s';
                cr.style.transform = 'translate3d(0,0,0)';
                cr.style.opacity = '1';
            });
        }
    }
    await sleep(430);
}

async function autoReshuffle(){
    const msg = document.createElement('div');
    msg.className = 'board-message';
    msg.textContent = t('msg_reshuffle');
    boardEl.appendChild(msg);
    await sleep(1200);
    msg.remove();
    const crystals = [];
    for(let r = 0; r < ROWS; r++){
        for(let c = 0; c < COLS; c++){
            const d = state.grid[r][c];
            if(d && d.type === 'crystal') crystals.push(d);
        }
    }
    for(let i = crystals.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [crystals[i], crystals[j]] = [crystals[j], crystals[i]];
    }
    let idx = 0;
    for(let r = 0; r < ROWS; r++){
        for(let c = 0; c < COLS; c++){
            if(state.grid[r][c] && state.grid[r][c].type === 'stone') continue;
            let placed = false, attempts = 0;
            while(!placed && attempts < 100){
                attempts++;
                const cand = crystals[idx % crystals.length];
                if(!wouldMatch(state.grid, r, c, cand.colorIdx)){
                    state.grid[r][c] = cand;
                    idx++;
                    placed = true;
                } else idx++;
            }
            if(!placed) state.grid[r][c] = randCrystal();
        }
    }
    renderBoard();
    if(!hasPossibleMove(state.grid)) await autoReshuffle();
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function findHint(){
    for(let r = 0; r < ROWS; r++){
        for(let c = 0; c < COLS; c++){
            const a = state.grid[r][c];
            if(!a || a.type !== 'crystal' || a.isJoker) continue;
            if(c+1 < COLS){
                const b = state.grid[r][c+1];
                if(b && b.type === 'crystal' && !b.isJoker){
                    swapCells(state.grid, r, c, r, c+1);
                    const m = findMatches(state.grid);
                    swapCells(state.grid, r, c, r, c+1);
                    if(m.length > 0) return [{r,c},{r,c:c+1}];
                }
            }
            if(r+1 < ROWS){
                const b = state.grid[r+1][c];
                if(b && b.type === 'crystal' && !b.isJoker){
                    swapCells(state.grid, r, c, r+1, c);
                    const m = findMatches(state.grid);
                    swapCells(state.grid, r, c, r+1, c);
                    if(m.length > 0) return [{r,c},{r:r+1,c}];
                }
            }
        }
    }
    return null;
}
function showHint(){
    const hint = findHint();
    if(!hint){ showToast(t('toast_noMoves')); return; }
    for(const {r, c} of hint){
        const cr = getCellEl(r, c)?.querySelector('.crystal');
        if(cr){
            cr.classList.add('hint');
            setTimeout(() => cr.classList.remove('hint'), 2800);
        }
    }
}

function showToast(text){
    const old = document.querySelector('.toast');
    if(old) old.remove();
    const tEl = document.createElement('div');
    tEl.className = 'toast';
    tEl.textContent = text;
    document.getElementById('app').appendChild(tEl);
    setTimeout(() => {
        tEl.style.opacity = '0';
        tEl.style.transition = 'opacity .3s';
        setTimeout(()=>tEl.remove(), 320);
    }, 1800);
}

function buildTextureGrid(){
    const grid = $('textureGrid');
    grid.innerHTML = '';
    const fragment = document.createDocumentFragment();
    for(const slotData of TEXTURE_SLOTS){
        const i = slotData.idx;
        const slot = document.createElement('div');
        slot.className = 'texture-slot';
        slot.dataset.idx = i;
        if(state.textures[i]) slot.classList.add('loaded');
        const preview = document.createElement('div');
        preview.className = 'texture-preview';
        const cr = document.createElement('div');
        cr.className = 'crystal';
        if(slotData.type === 'crystal'){
            cr.classList.add('shape-' + slotData.shape);
            cr.classList.add(slotData.css);
            cr.classList.add('lit');
        } else if(slotData.type === 'joker'){
            cr.classList.add('joker');
            cr.classList.add('shape-' + JOKER_SHAPE);
        } else if(slotData.type === 'stone'){
            cr.classList.add('stone');
            cr.classList.add('shape-hexagon');
        }
        const tex = state.textures[i];
        if(tex){
            cr.style.setProperty('--texture', `url(${tex})`);
            cr.classList.add('has-texture');
        }
        preview.appendChild(cr);
        const name = document.createElement('div');
        name.className = 'slot-name';
        name.textContent = slotData.name;
        const status = document.createElement('div');
        status.className = 'slot-status';
        status.textContent = '✓';
        const clearBtn = document.createElement('button');
        clearBtn.className = 'clear-btn';
        clearBtn.textContent = '×';
        clearBtn.title = 'Убрать текстуру';
        clearBtn.addEventListener('click', e => {
            e.stopPropagation();
            state.textures[i] = null;
            saveTextures();
            buildTextureGrid();
            if(state.gameActive) renderBoard();
            showToast('🗑');
        });
        slot.appendChild(preview);
        slot.appendChild(name);
        slot.appendChild(status);
        slot.appendChild(clearBtn);
        slot.addEventListener('click', () => {
            const input = $('fileInputTexture');
            input.dataset.idx = i;
            input.value = '';
            input.click();
        });
        fragment.appendChild(slot);
    }
    grid.appendChild(fragment);
}

$('fileInputTexture').addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    const idx = +e.target.dataset.idx;
    if(isNaN(idx)) return;
    const reader = new FileReader();
    reader.onload = ev => {
        const dataUrl = ev.target.result;
        const img = new Image();
        img.onload = () => {
            if(img.width !== 512 || img.height !== 512){
                showToast(`⚠️ ${img.width}×${img.height} (реком. 512×512)`);
            }
            state.textures[idx] = dataUrl;
            saveTextures();
            buildTextureGrid();
            if(state.gameActive) renderBoard();
            showToast(t('toast_textureLoaded'));
        };
        img.onerror = () => showToast('❌ Не удалось загрузить');
        img.src = dataUrl;
    };
    reader.readAsDataURL(file);
});

$('btnExportTextures').addEventListener('click', () => {
    const data = {
        version: 3, game: 'Crystalz',
        slots: TEXTURE_SLOTS.map(s => s.name),
        textures: state.textures,
        exportedAt: new Date().toISOString(),
    };

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'crystalz_textures_' + Date.now() + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast(t('toast_textureExported'));
});

$('btnImportTextures').addEventListener('click', () => {
    const input = $('fileInputJSON');
    input.value = '';
    input.click();
});

$('fileInputJSON').addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        try {
            const data = JSON.parse(ev.target.result);
            if(!Array.isArray(data.textures)) throw new Error('bad format');
            for(let i = 0; i < TOTAL_TEXTURE_SLOTS; i++){
                state.textures[i] = data.textures[i] || null;
            }
            saveTextures();
            buildTextureGrid();
            if(state.gameActive) renderBoard();
            showToast(t('toast_textureImported'));
        } catch(err){
            showToast('❌ Ошибка файла');
        }
    };
    reader.readAsText(file);
});

$('btnResetTextures').addEventListener('click', () => {
    if(!confirm('Убрать все загруженные текстуры?')) return;
    state.textures = new Array(TOTAL_TEXTURE_SLOTS).fill(null);
    saveTextures();
    buildTextureGrid();
    if(state.gameActive) renderBoard();
    showToast(t('toast_textureReset'));
});

$('btnTextures').addEventListener('click', () => {
    buildTextureGrid();
    $('textureModal').classList.add('active');
});
$('btnCloseModal').addEventListener('click', () => {
    $('textureModal').classList.remove('active');
});
$('textureModal').addEventListener('click', e => {
    if(e.target === $('textureModal')) $('textureModal').classList.remove('active');
});

// ============================================================
//  CHANGELOG
// ============================================================
function buildChangelog(){
    const list = $('changelogList');
    list.innerHTML = '';
    const fragment = document.createDocumentFragment();
    for(const ver of CHANGELOG){
        const li = document.createElement('li');
        li.className = 'changelog-version' + (ver.latest ? ' latest' : '');
        const header = document.createElement('div');
        header.className = 'changelog-header';
        const verEl = document.createElement('span');
        verEl.className = 'changelog-ver' + (ver.latest ? ' latest' : '');
        verEl.textContent = 'v' + ver.version;
        const dateEl = document.createElement('span');
        dateEl.className = 'changelog-date';
        dateEl.textContent = ver.date;
        header.appendChild(verEl);
        header.appendChild(dateEl);
        li.appendChild(header);
        const items = document.createElement('ul');
        items.className = 'changelog-items';
        for(const it of ver.items){
            const item = document.createElement('li');
            item.className = it.type;
            item.textContent = it.text;
            items.appendChild(item);
        }
        li.appendChild(items);
        fragment.appendChild(li);
    }
    list.appendChild(fragment);
}

$('btnChangelog').addEventListener('click', () => {
    buildChangelog();
    $('changelogModal').classList.add('active');
});
$('btnCloseChangelog').addEventListener('click', () => {
    $('changelogModal').classList.remove('active');
});
$('changelogModal').addEventListener('click', e => {
    if(e.target === $('changelogModal')) $('changelogModal').classList.remove('active');
});

// ============================================================
//  МУЗЫКА — кнопки
// ============================================================
function updateMusicButtons(){
    const btn1 = $('btnMusic');
    const btn2 = $('btnMusicGame');
    [btn1, btn2].forEach(b => {
        if(!b) return;
        b.classList.toggle('active', state.musicEnabled);
        b.textContent = state.musicEnabled ? '🔊' : '🎵';
    });
}
function toggleMusic(){
    state.musicEnabled = music.toggle();
    saveMusicPref();
    updateMusicButtons();
    showToast(state.musicEnabled ? t('toast_musicOn') : t('toast_musicOff'));
}
$('btnMusic').addEventListener('click', toggleMusic);
$('btnMusicGame').addEventListener('click', toggleMusic);

// ============================================================
//  ЗАПУСК ИГРЫ
// ============================================================
function startGame(mode){
    state.mode = mode;
    state.grid = generateGrid(mode);
    state.score = 0;
    state.selected = null;
    state.animating = false;
    state.gameActive = true;
    state.gamesPlayed++;
    state.lastSwapped = null;
    saveProgress();
    updateHUD();
    menuEl.classList.add('hidden');
    gameEl.classList.add('active');
    weatherLayer.innerHTML = '';
    requestAnimationFrame(() => {
        renderBoard();
        if(!hasPossibleMove(state.grid)) autoReshuffle();
    });
}
function goToMenu(){
    state.gameActive = false;
    gameEl.classList.remove('active');
    menuEl.classList.remove('hidden');
    menuEl.classList.add('time-' + getTimeOfDay());
    applyMenuAtmosphere();
    updateHUD();
    saveProgress();
}

$('btnClassic').addEventListener('click', () => startGame('classic'));
$('btnStones').addEventListener('click', () => startGame('stones'));
$('btnMenu').addEventListener('click', goToMenu);
$('btnHint').addEventListener('click', showHint);

document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', function(){
        setLanguage(this.dataset.lang);
    });
});

document.querySelectorAll('#seasonBtns .atmo-btn').forEach(btn => {
    btn.addEventListener('click', function(){
        state.manualSeason = this.dataset.season;
        if(state.manualSeason !== 'winter' && state.manualWeather === 'snow'){
            state.manualWeather = 'clear';
        }
        saveAtmo();
        applyMenuAtmosphere();
    });
});
document.querySelectorAll('#weatherBtns .atmo-btn').forEach(btn => {
    btn.addEventListener('click', function(){
        if(this.disabled) return;
        state.manualWeather = this.dataset.weather;
        saveAtmo();
        applyMenuAtmosphere();
    });
});

let resizeTimer;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        if(state.gameActive) renderBoard();
        applyMenuAtmosphere();
    }, 150);
});

// ============================================================
//  ИНИЦИАЛИЗАЦИЯ
// ============================================================
loadLanguage();
loadProgress();
loadTextures();
loadAtmo();
loadMusicPref();

if(state.manualWeather === 'snow' && state.manualSeason && state.manualSeason !== 'winter'){
    state.manualWeather = 'clear';
    saveAtmo();
}

updateHUD();
applyTranslations();
applyMenuAtmosphere();
updateMusicButtons();

if(state.musicEnabled){
    const startOnFirstClick = () => {
        if(state.musicEnabled && !music.isPlaying){
            music.start();
        }
        document.removeEventListener('click', startOnFirstClick);
        document.removeEventListener('touchstart', startOnFirstClick);
    };
    document.addEventListener('click', startOnFirstClick, {once:true});
    document.addEventListener('touchstart', startOnFirstClick, {once:true});
}

setInterval(() => {
    if(!state.gameActive) applyMenuAtmosphere();
}, 5 * 60 * 1000);

})();
</script>
