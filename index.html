<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crystalz — Три в ряд</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',Roboto,system-ui,sans-serif}
body{background:#0a0e1a;display:flex;justify-content:center;align-items:center;transition:background 1s ease}
body.season-winter{background:linear-gradient(160deg,#0a1220,#1a2a45 50%,#0d1a30)}
body.season-spring{background:linear-gradient(160deg,#0a1a10,#1a3a25 50%,#0d2015)}
body.season-summer{background:linear-gradient(160deg,#0a1a2a,#1a3a5a 50%,#0d2540)}
body.season-autumn{background:linear-gradient(160deg,#1a0e05,#3a2010 50%,#201005)}
#app{width:100%;height:100%;max-width:520px;max-height:100vh;position:relative;display:flex;flex-direction:column;overflow:hidden}
#weatherLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;contain:strict}
#weatherLayer .rain-drop{position:absolute;width:2px;background:linear-gradient(transparent,rgba(180,210,255,.7));animation:rainfall linear infinite;will-change:transform}
@keyframes rainfall{0%{transform:translate3d(0,-20px,0);opacity:0}10%{opacity:1}100%{transform:translate3d(0,100vh,0);opacity:.3}}
#weatherLayer .snow-flake{position:absolute;color:rgba(255,255,255,.8);animation:snowfall linear infinite;will-change:transform}
@keyframes snowfall{0%{transform:translate3d(0,-20px,0);opacity:0}10%{opacity:1}100%{transform:translate3d(40px,100vh,0);opacity:.2}}
#weatherLayer .cloud{position:absolute;background:rgba(255,255,255,.06);border-radius:50%;filter:blur(20px);animation:cloudmove linear infinite;will-change:transform}
@keyframes cloudmove{0%{transform:translate3d(-100%,0,0)}100%{transform:translate3d(100vw,0,0)}}
#menu{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;transition:opacity .5s,visibility .5s;overflow:hidden;overflow-y:auto}
#menu.hidden{opacity:0;visibility:hidden;pointer-events:none}
#menu::before{content:'';position:absolute;inset:0;pointer-events:none;transition:background 1.5s ease;z-index:0}
#menu.time-morning::before{background:radial-gradient(ellipse at 30% 20%,rgba(255,220,150,.15),transparent 60%)}
#menu.time-day::before{background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.08),transparent 70%)}
#menu.time-evening::before{background:radial-gradient(ellipse at 70% 30%,rgba(255,150,80,.18),transparent 60%)}
#menu.time-night::before{background:radial-gradient(ellipse at 50% 10%,rgba(120,150,255,.12),transparent 60%)}
.menu-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:400px;padding:20px 0}
.menu-top-bar{position:fixed;top:14px;right:14px;z-index:10;display:flex;gap:8px}
.lang-btn,.icon-top-btn{background:rgba(30,45,60,.85);border:1px solid rgba(70,100,140,.5);color:#b7d3f0;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.5px}
.icon-top-btn{padding:6px 10px;font-size:14px}
.lang-btn:hover,.icon-top-btn:hover{background:rgba(50,75,100,.95)}
.lang-btn:active,.icon-top-btn:active{transform:scale(.95)}
.lang-btn.active,.icon-top-btn.active{background:#2b6a9e;border-color:#4084bf;color:#fff}
.currency-display{position:fixed;top:14px;left:14px;z-index:10;display:flex;gap:8px}
.currency-item{background:rgba(30,45,60,.85);border:1px solid rgba(70,100,140,.5);color:#b7d3f0;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.currency-item .val{color:#ffdd59}
.menu-title{font-size:clamp(38px,12vw,60px);font-weight:900;letter-spacing:-2px;background:linear-gradient(135deg,#d6e6ff,#96b9e6,#c8a0ff,#ffb0c8,#d6e6ff);background-size:300% 300%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;margin-bottom:2px;animation:titleShine 6s ease-in-out infinite,titleFloat 4s ease-in-out infinite,titleGlow 3s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(180,150,255,.5))}
@keyframes titleShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes titleFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.03)}}
@keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 15px rgba(180,150,255,.4)) drop-shadow(0 0 30px rgba(150,180,230,.2))}50%{filter:drop-shadow(0 0 30px rgba(200,170,255,.8)) drop-shadow(0 0 60px rgba(150,180,230,.5))}}
.menu-subtitle{color:#7c9ab9;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.menu-info{color:#5b7897;font-size:12px;line-height:1.6;margin-top:4px}
.menu-info .season-name,.menu-info .time-name,.menu-info .weather-name{color:#9bbad9;font-weight:600}
.menu-btn{width:100%;padding:14px 22px;border-radius:60px;border:none;font-size:16px;font-weight:700;cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:.3px;color:#fff}
.menu-btn:active{transform:scale(.97)}
.menu-btn-classic{background:linear-gradient(135deg,#2b6a9e,#1e4d75);box-shadow:0 6px 24px rgba(43,106,158,.5),inset 0 1px 0 rgba(255,255,255,.15);border:1px solid rgba(100,160,220,.4)}
.menu-btn-classic:hover{background:linear-gradient(135deg,#347bb8,#2b6a9e);box-shadow:0 8px 30px rgba(43,106,158,.6)}
.menu-btn-stones{background:linear-gradient(135deg,#6e5a2d,#4a3a1a);box-shadow:0 6px 24px rgba(138,106,47,.5),inset 0 1px 0 rgba(255,255,255,.15);border:1px solid rgba(180,160,100,.4)}
.menu-btn-stones:hover{background:linear-gradient(135deg,#8a6a3a,#6e5a2d);box-shadow:0 8px 30px rgba(138,106,47,.6)}
.menu-btn-digger{background:linear-gradient(135deg,#5a3d1e,#3a2510);box-shadow:0 6px 24px rgba(90,61,30,.5),inset 0 1px 0 rgba(255,255,255,.15);border:1px solid rgba(160,120,70,.4)}
.menu-btn-digger:hover{background:linear-gradient(135deg,#7a5228,#5a3d1e);box-shadow:0 8px 30px rgba(90,61,30,.6)}
.menu-btn-digger:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.5);pointer-events:none}
.menu-btn-shop{background:linear-gradient(135deg,#6e2d8a,#4a1a5e);box-shadow:0 6px 24px rgba(138,47,158,.5),inset 0 1px 0 rgba(255,255,255,.15);border:1px solid rgba(200,120,220,.4)}
.menu-btn-shop:hover{background:linear-gradient(135deg,#8a3aa8,#6e2d8a);box-shadow:0 8px 30px rgba(138,47,158,.6)}
.menu-stats{margin-top:8px;display:flex;gap:16px;font-size:12px;color:#5b7897;background:rgba(20,30,42,.6);padding:10px 20px;border-radius:40px;border:1px solid rgba(60,80,110,.3);flex-wrap:wrap;justify-content:center}
.menu-stats .val{color:#c8ddf0;font-weight:700}
.atmo-panel{margin-top:8px;width:100%;background:rgba(20,30,42,.7);border-radius:20px;padding:12px 14px;border:1px solid rgba(60,80,110,.4);display:flex;flex-direction:column;gap:8px}
.atmo-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:#9bbad9;flex-wrap:wrap}
.atmo-row .atmo-label{color:#7c9ab9;font-weight:600;min-width:60px;text-align:left}
.atmo-btns{display:flex;gap:4px;flex-wrap:wrap}
.atmo-btn{background:rgba(37,58,77,.8);border:1px solid rgba(58,84,107,.6);color:#b7d3f0;padding:4px 10px;border-radius:14px;font-size:11px;font-weight:600;cursor:pointer;transition:.2s}
.atmo-btn:hover:not(:disabled){background:rgba(50,75,100,.9)}
.atmo-btn.active{background:#2b6a9e;border-color:#4084bf;color:#fff}
.atmo-btn:active:not(:disabled){transform:scale(.95)}
.atmo-btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.7)}
.bottom-links{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.bottom-link{background:rgba(30,45,60,.7);border:1px solid rgba(70,100,140,.4);color:#9bbad9;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:5px}
.bottom-link:hover{background:rgba(50,75,100,.9);color:#c8ddf0}
.bottom-link:active{transform:scale(.95)}
#game{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;transition:opacity .4s}
#game.active{display:flex}
.game-header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(15,24,34,.9);border-bottom:1px solid rgba(40,60,90,.6);z-index:20;flex-shrink:0;gap:8px}
.score-display{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#c8ddf0;flex-wrap:wrap}
.score-display .label{color:#6c93b9;font-size:11px;font-weight:500}
.score-display .level-info{color:#7c9ab9;font-size:11px}
.score-display .level-info b{color:#ffdd59}
.level-progress{position:relative;height:4px;background:rgba(40,60,90,.6);border-radius:2px;overflow:hidden}
.level-progress-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4084bf,#2ed573);border-radius:2px;transition:width .4s ease;box-shadow:0 0 8px rgba(46,213,115,.6)}
.game-buttons{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:10px;border:none;background:rgba(37,58,77,.8);color:#b7d3f0;font-size:15px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;border:1px solid rgba(58,84,107,.6)}
.icon-btn:active{transform:scale(.92);background:rgba(50,75,100,.9)}
.icon-btn.active{background:#2b6a9e;border-color:#4084bf;color:#fff}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6px;overflow:hidden;min-height:0;position:relative;z-index:5}
#board{display:grid;gap:2px;padding:6px;border-radius:14px;background:rgba(10,16,24,.8);box-shadow:0 0 40px rgba(0,0,0,.6);border:1px solid rgba(60,90,130,.5);position:relative;touch-action:none;contain:layout paint}
.cell{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s ease;border-radius:8px}
.cell.selected{background:rgba(120,180,240,.2);box-shadow:inset 0 0 0 2px rgba(140,200,255,.9)}
.crystal{width:88%;height:88%;position:relative;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .25s ease;background-size:cover;background-position:center;background-repeat:no-repeat;display:flex;align-items:center;justify-content:center}
.crystal.animating{will-change:transform}
.crystal.lit{filter:drop-shadow(0 0 8px var(--glow))}
.crystal.lit-bright{filter:drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 20px var(--glow))}
.crystal.hint{animation:hintPulse 1.1s ease-in-out infinite}
@keyframes hintPulse{0%,100%{transform:scale(1);filter:brightness(1) drop-shadow(0 0 8px var(--glow,#fff))}50%{transform:scale(1.18);filter:brightness(1.6) drop-shadow(0 0 20px var(--glow,#fff))}}
.shape-triangle{clip-path:polygon(50% 5%,95% 90%,5% 90%)}
.shape-diamond{clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%)}
.shape-hexagon{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%)}
.shape-circle{border-radius:50%}
.shape-square{border-radius:18%}
.shape-star{clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.shape-pentagon{clip-path:polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%)}
.shape-octagon{clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%)}
.shape-drop{clip-path:polygon(50% 0%,65% 15%,78% 32%,88% 50%,92% 66%,88% 80%,78% 92%,65% 98%,50% 100%,35% 98%,22% 92%,12% 80%,8% 66%,12% 50%,22% 32%,35% 15%)}
.shape-vortex{clip-path:polygon(50% 0%,72% 18%,88% 10%,90% 38%,100% 55%,82% 72%,78% 95%,55% 88%,35% 100%,22% 80%,0% 68%,15% 45%,5% 22%,28% 18%,42% 0%)}
.shape-rare{clip-path:polygon(50% 0%,100% 30%,100% 70%,50% 100%,0% 70%,0% 30%)}
.shape-dirt{clip-path:none;border-radius:8%}
.c-red{background:linear-gradient(135deg,#ff5566,#c0392b,#ff8a9a);--glow:#ff5060}
.c-orange{background:linear-gradient(135deg,#ffb033,#e67e22,#ffd680);--glow:#ffa030}
.c-yellow{background:linear-gradient(135deg,#ffe566,#f1c40f,#fff5b0);--glow:#ffe050}
.c-green{background:linear-gradient(135deg,#3ee683,#27ae60,#8affb0);--glow:#40e080}
.c-cyan{background:linear-gradient(135deg,#80eeff,#00b4d8,#b8f5ff);--glow:#60e0ff}
.c-blue{background:linear-gradient(135deg,#6a6aff,#3a3acc,#9090ff);--glow:#7070ff}
.c-purple{background:linear-gradient(135deg,#b56ef5,#8e44ad,#d8b0ff);--glow:#b060f0}
.c-pink{background:linear-gradient(135deg,#ff7fb0,#e84393,#ffc0d8);--glow:#ff70a8}
.c-white{background:linear-gradient(135deg,#fff,#e0e2ea,#fff);--glow:#fff}
.crystal::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.35) 0%,transparent 40%,transparent 60%,rgba(0,0,0,.2) 100%);pointer-events:none;clip-path:inherit;z-index:1}
.crystal.has-texture::before{display:none}
.shape-circle.crystal::before{border-radius:50%}
.shape-square.crystal::before{border-radius:18%}
.crystal.has-texture{background:transparent !important;background-image:var(--texture) !important;background-size:cover !important;background-position:center !important;background-repeat:no-repeat !important}
.crystal.has-texture.shape-drop{background-size:78% 78% !important}
.crystal.has-texture.shape-vortex{background-size:82% 82% !important}
.crystal.has-texture.shape-triangle{background-size:82% 82% !important;background-position:center 60% !important}
.crystal.has-texture.shape-star{background-size:85% 85% !important}
.crystal.has-texture.shape-diamond{background-size:82% 82% !important}
.crystal.has-texture.shape-rare{background-size:80% 80% !important}
.crystal.bomb{animation:bombFloat 1.8s ease-in-out infinite}
.crystal.bomb::after{content:'💥';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(5vw,26px);text-shadow:0 0 12px rgba(255,220,80,1);animation:bombPulse 1s ease-in-out infinite;z-index:2;pointer-events:none}
.crystal.bomb.has-texture::before{display:none}
@keyframes bombFloat{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.06) rotate(3deg)}}
@keyframes bombPulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.2);filter:brightness(1.6)}}
.crystal.joker{background:linear-gradient(135deg,#ffdd59,#ff6b9d,#a55eea,#70e6ff,#2ed573,#ffdd59);background-size:400% 400%;animation:jokerShift 4s ease infinite,jokerGlow 1.8s ease-in-out infinite;--glow:#ffdd59}
.crystal.joker.has-texture{background-image:var(--texture) !important;background-size:82% 82% !important;background-position:center !important;background-repeat:no-repeat !important}
@keyframes jokerShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes jokerGlow{0%,100%{filter:brightness(1.1) drop-shadow(0 0 10px #ffdd59)}50%{filter:brightness(1.4) drop-shadow(0 0 20px #a55eea)}}
/* === РЕДКИЙ ГЕМ — цвет + золотая аура через drop-shadow === */
.crystal.rare {
    animation: rareShine 3s ease-in-out infinite;
    position: relative;
    filter:
        drop-shadow(0 0 6px #ffdd59)
        drop-shadow(0 0 14px #ffdd59)
        drop-shadow(0 0 4px var(--glow));
    z-index: 2;
}
.crystal.rare::before { display: none !important; }
.crystal.rare::after {
    content: '💎';
    position: absolute;
    top: 4%;
    right: 4%;
    font-size: min(2.8vw, 13px);
    line-height: 1;
    text-shadow: 0 0 6px rgba(255,220,80,1), 0 0 12px rgba(255,180,0,.8);
    z-index: 4;
    pointer-events: none;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
}
.crystal.rare.has-texture {
    background-image: var(--texture) !important;
    background-size: 82% 82% !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
    filter:
        drop-shadow(0 0 6px #ffdd59)
        drop-shadow(0 0 14px #ffdd59)
        drop-shadow(0 0 20px var(--glow));
}
.crystal.rare.has-texture::before { display: none !important; }
@keyframes rareShine {
    0%,100% {
        filter:
            drop-shadow(0 0 6px #ffdd59)
            drop-shadow(0 0 14px #ffdd59)
            drop-shadow(0 0 4px var(--glow))
            brightness(1);
    }
    50% {
        filter:
            drop-shadow(0 0 12px #ffdd59)
            drop-shadow(0 0 24px #ffdd59)
            drop-shadow(0 0 10px var(--glow))
            brightness(1.25);
    }
}
.crystal.stone{background:linear-gradient(135deg,#6a6a6a,#2a2a2a,#5a5a5a);clip-path:polygon(20% 10%,80% 0%,100% 40%,90% 90%,30% 100%,0% 70%,5% 25%);--glow:#5a5a5a}
.crystal.stone::after{content:'';position:absolute;inset:10%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25),transparent 60%);border-radius:inherit}
.crystal.stone.has-texture{background:transparent !important;background-image:var(--texture) !important;background-size:cover !important;background-position:center !important;background-repeat:no-repeat !important}
.crystal.stone.has-texture::before,.crystal.stone.has-texture::after{display:none}
/* === ЗЕМЛЯ === */
.crystal.dirt {
    background:
        radial-gradient(circle at 20% 25%, rgba(120,80,40,.5), transparent 50%),
        radial-gradient(circle at 75% 30%, rgba(80,50,20,.6), transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(100,65,30,.5), transparent 55%),
        linear-gradient(135deg, #6b4423, #4a2e12, #5c3a1a);
    --glow: #6b4423;
    animation: dirtShine 3s ease-in-out infinite;
    clip-path: none;
    border-radius: 10%;
    box-shadow:
        inset 0 4px 8px rgba(0,0,0,.6),
        inset 0 -3px 6px rgba(255,255,255,.08),
        0 2px 6px rgba(0,0,0,.7);
}
.crystal.dirt::after {
    content: '⛏️';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(4vw, 22px);
    opacity: .35;
    pointer-events: none;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.8));
}
.crystal.dirt.has-texture {
    background: transparent !important;
    background-image: var(--texture) !important;
    background-size: cover !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
    box-shadow:
        inset 0 4px 8px rgba(0,0,0,.6),
        inset 0 -3px 6px rgba(255,255,255,.08),
        0 2px 6px rgba(0,0,0,.7);
}
.crystal.dirt.has-texture::after { opacity: .25; }
@keyframes dirtShine {
    0%,100% { filter: brightness(1) drop-shadow(0 0 4px rgba(107,68,35,.5)); }
    50% { filter: brightness(1.15) drop-shadow(0 0 10px rgba(107,68,35,.7)); }
}
.crystal.pop{animation:popOut .45s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes popOut{0%{transform:scale(1) rotate(0deg);opacity:1}40%{transform:scale(1.3) rotate(15deg);opacity:.9;filter:brightness(1.8)}100%{transform:scale(0) rotate(45deg);opacity:0}}
.crystal.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0deg)}20%{transform:translateX(-6px) rotate(-5deg)}40%{transform:translateX(6px) rotate(5deg)}60%{transform:translateX(-5px) rotate(-3deg)}80%{transform:translateX(5px) rotate(3deg)}}
.crystal.dragging{z-index:100;transform:scale(1.15) !important;filter:brightness(1.4) drop-shadow(0 0 20px rgba(255,255,255,.9)) !important;pointer-events:none;transition:none !important}
.cell.drag-target{background:rgba(140,200,255,.2);box-shadow:inset 0 0 0 2px rgba(140,200,255,.7)}
.cell.joker-target{background:rgba(255,220,80,.25);box-shadow:inset 0 0 0 2px rgba(255,220,80,.9)}
.explosion-particle{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:50}
.explosion-ring{position:absolute;border:3px solid;border-radius:50%;pointer-events:none;z-index:49;animation:ringExpand .6s cubic-bezier(.17,.67,.4,1.2) forwards}
@keyframes ringExpand{0%{transform:scale(0);opacity:1}100%{transform:scale(3);opacity:0}}
.float-score{position:absolute;font-weight:900;font-size:20px;pointer-events:none;z-index:60;color:#ffdd59;text-shadow:0 0 12px rgba(255,220,0,.9),0 2px 4px rgba(0,0,0,.9);animation:floatUp 1s cubic-bezier(.17,.67,.4,1.1) forwards}
@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-10px) scale(1.2);opacity:1}100%{transform:translateY(-55px) scale(1);opacity:0}}
.screen-flash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.6),rgba(200,220,255,.3) 40%,transparent 70%);opacity:0;pointer-events:none;z-index:70;transition:opacity .15s ease}
.screen-flash.active{opacity:1}

const audio = {
    ctx:null, sfxGain:null,
    init(){
        if(this.ctx) return;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if(!AC) return;
            this.ctx = new AC();
            this.sfxGain = this.ctx.createGain();
            this.sfxGain.gain.value = state.sfxVolume;
            this.sfxGain.connect(this.ctx.destination);
        } catch(e){}
    },
    setVolume(v){ state.sfxVolume = v; if(this.sfxGain) this.sfxGain.gain.value = v; },
    play(freq, type, dur, vol, when){
        if(!state.sfxEnabled || !this.ctx) return;
        const now = (when || this.ctx.currentTime);
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(vol || 0.15, now + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(g); g.connect(this.sfxGain);
        osc.start(now); osc.stop(now + dur + 0.05);
    },
    swap(){ this.init(); this.play(700, 'sine', 0.12, 0.1); },
    match(c){ this.init(); if(!this.ctx) return; const now = this.ctx.currentTime; for(let i = 0; i < Math.min(c, 5); i++) this.play(550 * Math.pow(1.15, i), 'sine', 0.25, 0.09, now + i * 0.04); },
    explode(){
        this.init(); if(!this.ctx) return;
        const now = this.ctx.currentTime;
        const bs = this.ctx.sampleRate * 0.3;
        const buf = this.ctx.createBuffer(1, bs, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for(let i = 0; i < bs; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/bs, 3);
        const n = this.ctx.createBufferSource(); n.buffer = buf;
        const g = this.ctx.createGain(); g.gain.value = 0.15;
        const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 800;
        n.connect(f); f.connect(g); g.connect(this.sfxGain); n.start(now);
        this.play(80, 'sine', 0.35, 0.25);
    },
    joker(){ this.init(); if(!this.ctx) return; const now = this.ctx.currentTime; for(let i = 0; i < 8; i++) this.play(400 + i * 120, 'triangle', 0.3, 0.08, now + i * 0.05); },
    error(){ this.init(); this.play(200, 'square', 0.15, 0.08); if(this.ctx) this.play(150, 'square', 0.2, 0.08, this.ctx.currentTime + 0.15); },
    click(){ this.init(); this.play(900, 'sine', 0.08, 0.07); },
    rare(){ this.init(); if(!this.ctx) return; const now = this.ctx.currentTime; [1046, 1318, 1568].forEach((f, i) => this.play(f, 'sine', 0.4, 0.12, now + i * 0.08)); },
    levelup(){ this.init(); if(!this.ctx) return; const now = this.ctx.currentTime; [523, 659, 784, 1046, 1318].forEach((f, i) => this.play(f, 'sine', 0.5, 0.13, now + i * 0.1)); },
    buy(){ this.init(); if(!this.ctx) return; const now = this.ctx.currentTime; [784, 1046].forEach((f, i) => this.play(f, 'sine', 0.3, 0.12, now + i * 0.1)); },
    dig(){ this.init(); if(!this.ctx) return; const now = this.ctx.currentTime; this.play(150, 'square', 0.2, 0.12); this.play(100, 'triangle', 0.3, 0.1, now + 0.05); },
};

const music = {
    ctx:null, masterGain:null, isPlaying:false,
    nextNoteTime:0, timerId:null, step:0, direction:1,
    scale:[523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51],
    bassLine:[130.81, 196.00, 220.00, 174.61], tempo:0.9,
    init(){
        if(this.ctx) return;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if(!AC) return;
            this.ctx = new AC();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0;
            const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 3500; f.Q.value = 0.5;
            const d = this.ctx.createDelay(); d.delayTime.value = 0.35;
            const fb = this.ctx.createGain(); fb.gain.value = 0.25;
            const dg = this.ctx.createGain(); dg.gain.value = 0.35;
            this.masterGain.connect(f); f.connect(this.ctx.destination);
            f.connect(dg); dg.connect(d); d.connect(fb); fb.connect(d); d.connect(this.ctx.destination);
        } catch(e){}
    },
    setVolume(v){ state.musicVolume = v; if(this.masterGain && this.isPlaying) this.masterGain.gain.value = v; },
    playBell(freq, time, dur, vol){
        if(!this.ctx) return;
        const o1 = this.ctx.createOscillator(); const o2 = this.ctx.createOscillator();
        const g = this.ctx.createGain(); const g2 = this.ctx.createGain();
        o1.type = 'sine'; o1.frequency.value = freq;
        o2.type = 'sine'; o2.frequency.value = freq * 2.01;
        g2.gain.value = 0.25;
        g.gain.setValueAtTime(0, time);
        g.gain.linearRampToValueAtTime(vol, time + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, time + dur);
        o1.connect(g); o2.connect(g2); g2.connect(g);
        g.connect(this.masterGain);
        o1.start(time); o2.start(time); o1.stop(time + dur + 0.1); o2.stop(time + dur + 0.1);
    },
    playBass(freq, time, dur){
        if(!this.ctx) return;
        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
        o.type = 'triangle'; o.frequency.value = freq;
        g.gain.setValueAtTime(0, time);
        g.gain.linearRampToValueAtTime(0.09, time + 0.15);
        g.gain.exponentialRampToValueAtTime(0.001, time + dur);
        o.connect(g); g.connect(this.masterGain);
        o.start(time); o.stop(time + dur + 0.1);
    },
    scheduleNote(){
        if(!this.isPlaying || !this.ctx) return;
        const now = this.ctx.currentTime;
        if(Math.random() < 0.15) this.step = Math.floor(Math.random() * this.scale.length);
        else {
            this.step += this.direction;
            if(this.step >= this.scale.length - 1){ this.step = this.scale.length - 2; this.direction = -1; }
            else if(this.step <= 0){ this.step = 1; this.direction = 1; }
            if(Math.random() < 0.3) this.direction *= -1;
        }
        const vol = 0.14 + Math.random() * 0.06;
        this.playBell(this.scale[this.step], now, 0.9 + Math.random() * 0.8, vol);
        if(Math.random() < 0.3){
            const i2 = Math.max(0, Math.min(this.scale.length - 1, this.step + (Math.random()<0.5?1:-1)));
            this.playBell(this.scale[i2], now + 0.3, 0.7, vol * 0.7);
        }
        if(this.step % 4 === 0){
            const bi = Math.floor((this.step / 4) % this.bassLine.length);
            this.playBass(this.bassLine[bi], now, 2.5);
        }
        this.nextNoteTime = now + this.tempo + Math.random() * 0.4;
    },
    start(){
        this.init(); if(!this.ctx || this.isPlaying) return;
        if(this.ctx.state === 'suspended') this.ctx.resume();
        this.isPlaying = true;
        this.step = Math.floor(Math.random() * 4) + 2;
        this.direction = Math.random() < 0.5 ? 1 : -1;
        this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);
        this.masterGain.gain.linearRampToValueAtTime(state.musicVolume, this.ctx.currentTime + 2.5);
        const tick = () => { if(!this.isPlaying) return; if(this.ctx.currentTime >= this.nextNoteTime) this.scheduleNote(); this.timerId = setTimeout(tick, 150); };
        this.nextNoteTime = this.ctx.currentTime;
        tick();
    },
    stop(){
        if(!this.ctx || !this.isPlaying) return;
        this.isPlaying = false;
        this.masterGain.gain.cancelScheduledValues(this.ctx.currentTime);
        this.masterGain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1.8);
        if(this.timerId){ clearTimeout(this.timerId); this.timerId = null; }
    },
    toggle(){ if(this.isPlaying) this.stop(); else this.start(); return this.isPlaying; },
};

function getSeason(){
    if(state.manualSeason) return state.manualSeason;
    const m = new Date().getMonth();
    if(m === 11 || m <= 1) return 'winter';
    if(m <= 4) return 'spring';
    if(m <= 7) return 'summer';
    return 'autumn';
}
function getTimeOfDay(){
    const h = new Date().getHours();
    if(h >= 5 && h < 12) return 'morning';
    if(h >= 12 && h < 17) return 'day';
    if(h >= 17 && h < 22) return 'evening';
    return 'night';
}
function getWeather(){
    if(state.manualWeather) return state.manualWeather;
    const s = getSeason();
    let pool = ['clear','clear','clear','rain','rain','snow','snow','cloudy','cloudy'];
    if(s === 'winter') pool = ['snow','snow','snow','cloudy','cloudy','clear','clear','rain'];
    if(s === 'summer') pool = ['clear','clear','clear','clear','cloudy','cloudy','rain','rain'];
    if(s === 'autumn') pool = ['rain','rain','rain','cloudy','cloudy','clear','clear'];
    if(s === 'spring') pool = ['rain','rain','cloudy','cloudy','clear','clear','clear'];
    const seed = Math.floor(Date.now() / (1000*60*60*6));
    const idx = Math.abs(Math.sin(seed) * 10000) % pool.length;
    return pool[Math.floor(idx)];
}
function updateAtmosphereLabels(){
    const s = getSeason(), tm = getTimeOfDay(), w = getWeather();

function makeCrystalData(){
    const idx = Math.floor(Math.random() * CRYSTALS.length);
    return {
        type:'crystal', colorIdx: idx,
        shape: CRYSTALS[idx].shape, css: CRYSTALS[idx].css,
        isBomb:false, isJoker:false, isRare:false,
    };
}
function randCrystal(){
    const c = makeCrystalData();
    const roll = Math.random();
    const bombChance = state.gameBombsJokerBonus ? 0.03 : 0.015;
    const jokerChance = state.gameBombsJokerBonus ? 0.05 : 0.025;
    if(roll < bombChance) c.isBomb = true;
    else if(roll < jokerChance) c.isJoker = true;
    return c;
}
function randRare(){
    const c = makeCrystalData();
    c.isRare = true;
    c.shape = RARE_SHAPE;
    return c;
}
function randStone(){ return { type:'stone' }; }
function randDirt(){ return { type:'dirt' }; }
function createEmptyGrid(){ return Array.from({length:ROWS}, () => Array(COLS).fill(null)); }

function wouldMatch(grid, r, c, colorIdx){
    let cnt = 1;
    for(let i = c-1; i >= 0 && grid[r][i] && grid[r][i].type === 'crystal' && !grid[r][i].isRare && grid[r][i].colorIdx === colorIdx; i--) cnt++;
    for(let i = c+1; i < COLS && grid[r][i] && grid[r][i].type === 'crystal' && !grid[r][i].isRare && grid[r][i].colorIdx === colorIdx; i++) cnt++;
    if(cnt >= 3) return true;
    cnt = 1;
    for(let i = r-1; i >= 0 && grid[i][c] && grid[i][c].type === 'crystal' && !grid[i][c].isRare && grid[i][c].colorIdx === colorIdx; i--) cnt++;
    for(let i = r+1; i < ROWS && grid[i][c] && grid[i][c].type === 'crystal' && !grid[i][c].isRare && grid[i][c].colorIdx === colorIdx; i++) cnt++;
    if(cnt >= 3) return true;
    return false;
}

function generateGrid(mode){
    const grid = createEmptyGrid();
    const topStart = (mode === 'digger') ? 0 : 0;
    const dirtStartRow = (mode === 'digger') ? ROWS - DIGGER_DIRT_ROWS : ROWS;
    for(let r = topStart; r < dirtStartRow; r++){
        for(let c = 0; c < COLS; c++){
            let attempts = 0, cell;
            do { cell = randCrystal(); attempts++; }
            while(attempts < 50 && wouldMatch(grid, r, c, cell.colorIdx));
            grid[r][c] = cell;
        }
    }
    // Заполняем землю
    if(mode === 'digger'){
        for(let r = ROWS - DIGGER_DIRT_ROWS; r < ROWS; r++){
            for(let c = 0; c < COLS; c++) grid[r][c] = randDirt();
        }
        state.dirtLeft = ROWS * DIGGER_DIRT_ROWS;
    } else {
        state.dirtLeft = 0;
    }
    if(mode === 'stones'){
        const stoneCount = 4 + Math.floor(Math.random() * 3);
        let placed = 0, guard = 0;
        while(placed < stoneCount && guard < 500){
            guard++;
            const r = Math.floor(Math.random()*ROWS), c = Math.floor(Math.random()*COLS);
            if(grid[r][c] && grid[r][c].type === 'crystal'){ grid[r][c] = randStone(); placed++; }
        }
    }
    const rareCount = 1 + Math.floor(Math.random() * 2);
    let placedRare = 0, guardR = 0;
    while(placedRare < rareCount && guardR < 500){
        guardR++;
        const r = Math.floor(Math.random()*ROWS), c = Math.floor(Math.random()*COLS);
        const cell = grid[r][c];
        if(cell && cell.type === 'crystal' && !cell.isBomb && !cell.isJoker && !cell.isRare){
            grid[r][c] = randRare();
            placedRare++;
        }
    }
    return grid;
}

function findMatches(grid){
    const matches = [];
    for(let r = 0; r < ROWS; r++){
        let c = 0;
        while(c < COLS){
            const cell = grid[r][c];
            if(cell && cell.type === 'crystal' && !cell.isJoker && !cell.isRare){
                const color = cell.colorIdx;
                let end = c + 1;
                while(end < COLS){
                    const n = grid[r][end];
                    if(n && n.type === 'crystal' && !n.isJoker && !n.isRare && n.colorIdx === color) end++;
                    else break;
                }
                const len = end - c;
                if(len >= 3){
                    const cells = [];
                    for(let i = c; i < end; i++) cells.push({r, c:i});
                    matches.push({cells, colorIdx:color, length:len, isHorizontal:true});
                }
                c = end;
            } else c++;
        }
    }
    for(let c = 0; c < COLS; c++){
        let r = 0;
        while(r < ROWS){
            const cell = grid[r][c];
            if(cell && cell.type === 'crystal' && !cell.isJoker && !cell.isRare){
                const color = cell.colorIdx;
                let end = r + 1;
                while(end < ROWS){
                    const n = grid[end][c];
                    if(n && n.type === 'crystal' && !n.isJoker && !n.isRare && n.colorIdx === color) end++;
                    else break;
                }
                const len = end - r;
                if(len >= 3){
                    const cells = [];
                    for(let i = r; i < end; i++) cells.push({r:i, c});
                    matches.push({cells, colorIdx:color, length:len, isHorizontal:false});
                }
                r = end;
            } else r++;
        }
    }
    return matches;
}

function hasPossibleMove(grid){
    for(let r = 0; r < ROWS; r++){
        for(let c = 0; c < COLS; c++){
            const a = grid[r][c];
            if(!a || a.type !== 'crystal' || a.isJoker || a.isRare) continue;
            if(c+1 < COLS){
                const b = grid[r][c+1];
                if(b && b.type === 'crystal' && !b.isJoker){
                    swapCells(grid, r, c, r, c+1);
                    if(findMatches(grid).length > 0){ swapCells(grid, r, c, r, c+1); return true; }
                    swapCells(grid, r, c, r, c+1);
                }
            }
            if(r+1 < ROWS){
                const b = grid[r+1][c];
                if(b && b.type === 'crystal' && !b.isJoker){
                    swapCells(grid, r, c, r+1, c);
                    if(findMatches(grid).length > 0){ swapCells(grid, r, c, r+1, c); return true; }
                    swapCells(grid, r, c, r+1, c);
                }
            }
        }
    }
    return false;
}
function swapCells(g, r1, c1, r2, c2){ const t = g[r1][c1]; g[r1][c1] = g[r2][c2]; g[r2][c2] = t; }
function getBombBlastCells(grid, r, c){
    const cells = [];
    for(let i = r-1; i <= r+1; i++){
        for(let j = c-1; j <= c+1; j++){
            if(i >= 0 && i < ROWS && j >= 0 && j < COLS){
                const d = grid[i][j];
                if(d && !d.isRare) cells.push({r:i, c:j});
            }
        }
    }
    return cells;
}

let cellSize = 40, cellGap = 3;
function getCellEl(r, c){ return boardEl.children[r * COLS + c] || null; }

function renderBoard(){
    const wrap = boardEl.parentElement;
    const w = wrap.clientWidth - 16, h = wrap.clientHeight - 16;
    const maxW = Math.floor(w / COLS) - 3, maxH = Math.floor(h / ROWS) - 3;
    cellSize = Math.max(28, Math.min(maxW, maxH, 68));
    cellGap = Math.max(2, Math.floor(cellSize * 0.06));
    boardEl.style.gridTemplateColumns = `repeat(${COLS}, ${cellSize}px)`;
    boardEl.style.gridTemplateRows = `repeat(${ROWS}, ${cellSize}px)`;
    boardEl.style.gap = cellGap + 'px';
    const frag = document.createDocumentFragment();
    for(let r = 0; r < ROWS; r++){
        for(let c = 0; c < COLS; c++){
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.r = r; cell.dataset.c = c;
            cell.style.width = cellSize + 'px';
            cell.style.height = cellSize + 'px';
            if(state.selected && state.selected.r === r && state.selected.c === c) cell.classList.add('selected');
            const d = state.grid[r][c];
            if(d){
                const cr = createCrystalEl(d);
                cr.dataset.r = r; cr.dataset.c = c;
                cell.appendChild(cr);
            }
            frag.appendChild(cell);
        }
    }
    boardEl.innerHTML = '';
    boardEl.appendChild(frag);
}
function updateCell(r, c){
    const cell = getCellEl(r, c);
    if(!cell) return;
    cell.innerHTML = '';
    const d = state.grid[r][c];
    if(d){
        const cr = createCrystalEl(d);
        cr.dataset.r = r; cr.dataset.c = c;
        cell.appendChild(cr);
    }
    if(state.selected && state.selected.r === r && state.selected.c === c) cell.classList.add('selected');
    else cell.classList.remove('selected');
}
function updateSelection(){
    const prev = boardEl.querySelector('.cell.selected');
    if(prev) prev.classList.remove('selected');
    if(state.selected){
        const cell = getCellEl(state.selected.r, state.selected.c);
        if(cell) cell.classList.add('selected');
    }
}
function createCrystalEl(d){
    const el = document.createElement('div');
    el.className = 'crystal';
    if(d.type === 'stone'){
        el.classList.add('stone'); el.classList.add('shape-hexagon');
        if(state.textures[STONE_SLOT]){
            el.style.setProperty('--texture', `url(${state.textures[STONE_SLOT]})`);
            el.classList.add('has-texture');
        }
    } else if(d.type === 'dirt'){
        el.classList.add('dirt'); el.classList.add('shape-dirt');
        if(state.textures[DIRT_SLOT]){
            el.style.setProperty('--texture', `url(${state.textures[DIRT_SLOT]})`);
            el.classList.add('has-texture');
        }
    } else {
        el.classList.add('shape-' + d.shape);
        el.classList.add(d.css);
        if(d.isBomb) el.classList.add('bomb');
        if(d.isJoker){ el.classList.add('joker'); el.classList.add('shape-' + JOKER_SHAPE); }
        if(d.isRare){ el.classList.add('rare'); el.classList.add('shape-' + RARE_SHAPE); }
        let texIdx = d.isJoker ? JOKER_SLOT : (d.isRare ? RARE_SLOT : d.colorIdx);
        const tex = state.textures[texIdx];
        if(tex){ el.style.setProperty('--texture', `url(${tex})`); el.classList.add('has-texture'); }
        el.classList.add('lit');
        if(d.color === 'white' && !d.isRare) el.classList.add('lit-bright');
    }
    el.style.fontSize = Math.floor(cellSize * 0.5) + 'px';
    return el;
}

function updateHUD(){
    scoreVal.textContent = state.score;
    bestScoreEl.textContent = state.bestScore;
    gamesPlayedEl.textContent = state.gamesPlayed;
    currentLevelEl.textContent = state.level;

let dragState = null, dragEl = null;

function getCellFromPoint(x, y){
    const el = document.elementFromPoint(x, y);
    if(!el) return null;
    const cell = el.closest('.cell');
    if(!cell) return null;
    return { r:+cell.dataset.r, c:+cell.dataset.c, el:cell };
}
function clearDragTargets(){
    document.querySelectorAll('.cell.drag-target, .cell.joker-target').forEach(el => {
        el.classList.remove('drag-target'); el.classList.remove('joker-target');
    });
}
function clearDragging(){
    if(dragEl){
        dragEl.classList.remove('dragging');
        dragEl.style.left = ''; dragEl.style.top = '';
        dragEl.style.width = ''; dragEl.style.height = '';
        dragEl.style.position = ''; dragEl = null;
    }
}

boardEl.addEventListener('mousedown', e => {
    if(state.animating || !state.gameActive) return;
    const cell = e.target.closest('.cell');
    if(!cell) return;
    e.preventDefault();
    startDrag(+cell.dataset.r, +cell.dataset.c, e.clientX, e.clientY);
});
document.addEventListener('mousemove', e => { if(dragState){ e.preventDefault(); moveDrag(e.clientX, e.clientY); } });
document.addEventListener('mouseup', e => { if(dragState){ e.preventDefault(); endDrag(e.clientX, e.clientY); } });
boardEl.addEventListener('touchstart', e => {
    if(state.animating || !state.gameActive) return;
    const cell = e.target.closest('.cell');
    if(!cell) return;
    const t = e.touches[0];
    startDrag(+cell.dataset.r, +cell.dataset.c, t.clientX, t.clientY);
}, {passive:true});
document.addEventListener('touchmove', e => {
    if(!dragState) return;
    const t = e.touches[0];
    moveDrag(t.clientX, t.clientY);
    if(Math.abs(t.clientX - dragState.startX) > 8 || Math.abs(t.clientY - dragState.startY) > 8) e.preventDefault();
}, {passive:false});
document.addEventListener('touchend', e => {
    if(!dragState) return;
    const t = e.changedTouches[0];
    endDrag(t.clientX, t.clientY);
}, {passive:true});
document.addEventListener('touchcancel', () => { if(dragState) cancelDrag(); });

function startDrag(r, c, x, y){
    const d = state.grid[r][c];
    if(!d) return;
    if(d.type === 'stone'){ showToast(t('toast_stoneMove')); audio.error(); return; }
    if(d.type === 'dirt'){ showToast(t('toast_dirtCantMove')); audio.error(); return; }
    dragState = { r, c, startX:x, startY:y, moved:false, targetR:r, targetC:c, isJoker: d.isJoker, isBomb: d.isBomb };
    const cell = getCellEl(r, c);
    if(cell){
        const cr = cell.querySelector('.crystal');
        if(cr){
            dragEl = cr;
            cr.classList.add('dragging');
            const rect = cell.getBoundingClientRect();
            cr.style.position = 'fixed';
            cr.style.width = rect.width + 'px';
            cr.style.height = rect.height + 'px';
            cr.style.left = (rect.left + (rect.width - cellSize*0.88)/2) + 'px';
            cr.style.top = (rect.top + (rect.height - cellSize*0.88)/2) + 'px';
            cr.style.zIndex = 1000;
        }
    }
}
function moveDrag(x, y){
    if(!dragState) return;
    const dx = x - dragState.startX, dy = y - dragState.startY;
    if(Math.abs(dx) > 6 || Math.abs(dy) > 6) dragState.moved = true;
    if(dragEl){
        const off = cellSize * 0.44;
        dragEl.style.left = (x - off) + 'px';
        dragEl.style.top = (y - off) + 'px';
    }
    const target = getCellFromPoint(x, y);
    clearDragTargets();
    if(target && (target.r !== dragState.r || target.c !== dragState.c)){
        const dist = Math.abs(target.r - dragState.r) + Math.abs(target.c - dragState.c);
        if(dist === 1){
            dragState.targetR = target.r;
            dragState.targetC = target.c;
            target.el.classList.add(dragState.isJoker ? 'joker-target' : 'drag-target');
        } else {
            dragState.targetR = dragState.r;
            dragState.targetC = dragState.c;
        }
    } else {
        dragState.targetR = dragState.r;
        dragState.targetC = dragState.c;
    }
}
function endDrag(x, y){
    if(!dragState) return;
    const d = dragState;
    clearDragTargets();
    clearDragging();
    const dx = x - d.startX, dy = y - d.startY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(d.moved && dist > 15){
        let dr = 0, dc = 0;
        if(Math.abs(dx) > Math.abs(dy)) dc = dx > 0 ? 1 : -1;
        else dr = dy > 0 ? 1 : -1;
        const nr = d.r + dr, nc = d.c + dc;
        if(nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS){
            dragState = null;
            if(d.isJoker) handleJokerSwipe(d.r, d.c, nr, nc);
            else handleSwap(d.r, d.c, nr, nc);
            return;
        }
    }
    dragState = null;
    handleCellTap(d.r, d.c);
}
function cancelDrag(){
    dragState = null;
    clearDragTargets();
    clearDragging();
    state.selected = null;
    updateSelection();
}
function handleCellTap(r, c){
    const d = state.grid[r][c];
    if(!d) return;
    if(d.type === 'stone' || d.type === 'dirt') return;
    if(d.isJoker){ showToast('👆 Свайпни джокер на гем'); return; }
    if(!state.selected){
        state.selected = {r, c};
        updateSelection();
        audio.click();
        return;
    }
    const sr = state.selected.r, sc = state.selected.c;
    if(sr === r && sc === c){ state.selected = null; updateSelection(); return; }
    if(Math.abs(sr - r) + Math.abs(sc - c) === 1) handleSwap(sr, sc, r, c);
    else { state.selected = {r, c}; updateSelection(); }
}

async function handleJokerSwipe(jr, jc, tr, tc){
    const target = state.grid[tr][tc];
    const joker = state.grid[jr][jc];
    if(!target || !joker || !joker.isJoker){ cancelDrag(); return; }
    if(target.type === 'stone' || target.type === 'dirt'){ showToast('🚫 Нельзя убрать это джокером'); audio.error(); return; }
    if(target.isRare){ showToast('💎 Редкий гем нельзя убрать джокером'); audio.error(); return; }
    state.animating = true;
    state.selected = null;
    updateSelection();
    const targetColor = target.colorIdx;
    const toRemove = [];
    for(let i = 0; i < ROWS; i++){
        for(let j = 0; j < COLS; j++){
            const cd = state.grid[i][j];
            if(cd && cd.type === 'crystal' && !cd.isRare && !cd.isJoker && !cd.isBomb && cd.colorIdx === targetColor){
                toRemove.push({r:i, c:j});
            }
        }
    }
    toRemove.push({r:jr, c:jc});
    // Земля: убираем соседнюю с джокером
    const dirtsToRemove = [];
    for(let i = 0; i < ROWS; i++) for(let j = 0; j < COLS; j++){
        const cd = state.grid[i][j];
        if(cd && cd.type === 'dirt'){
            // Если сосед с любым из toRemove — убираем
            const near = toRemove.some(t2 => Math.abs(t2.r - i) + Math.abs(t2.c - j) === 1);
            if(near) dirtsToRemove.push({r:i, c:j});
        }
    }
    audio.joker();
    screenFlash.classList.add('active');
    setTimeout(()=>screenFlash.classList.remove('active'), 250);
    for(const {r, c} of toRemove){
        const cr = getCellEl(r, c)?.querySelector('.crystal');
        if(cr) cr.classList.add('pop');
    }
    for(const {r, c} of dirtsToRemove){
        const cr = getCellEl(r, c)?.querySelector('.crystal');
        if(cr) cr.classList.add('pop');
    }
    const originEl = getCellCenter(jr, jc);
    if(originEl) spawnExplosion(originEl.x, originEl.y, '#ffdd59', 24);
    addScore(toRemove.length * 30 + dirtsToRemove.length * 60, jr, jc);
    await sleep(450);
    for(const {r, c} of toRemove) state.grid[r][c] = null;
    for(const {r, c} of dirtsToRemove) state.grid[r][c] = null;
    await applyGravityAndRefill();
    await sleep(150);
    const m = findMatches(state.grid);
    if(m.length > 0) await resolveMatches(m);
    state.animating = false;
    if(!hasPossibleMove(state.grid)) await autoReshuffle();
}

async function handleSwap(r1, c1, r2, c2){
    if(state.animating) return;
    state.animating = true;
    state.selected = null;
    updateSelection();
    const a = state.grid[r1][c1];
    const b = state.grid[r2][c2];
    if(!a || !b){ state.animating = false; return; }
    if(a.type === 'stone' || b.type === 'stone' || a.type === 'dirt' || b.type === 'dirt'){
        state.animating = false;
        showToast(t(a.type === 'dirt' || b.type === 'dirt' ? 'toast_dirtCantMove' : 'toast_stoneMove'));
        audio.error();
        return;
    }
    const elA = getCellEl(r1, c1)?.querySelector('.crystal');
    const elB = getCellEl(r2, c2)?.querySelector('.crystal');
    if(elA && elB){
        const dx = (c2 - c1) * (cellSize + cellGap);
        const dy = (r2 - r1) * (cellSize + cellGap);
        elA.classList.add('animating'); elB.classList.add('animating');
        elA.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
        elB.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
        elA.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
        elB.style.transform = `translate3d(${-dx}px, ${-dy}px, 0)`;
        elA.style.zIndex = '5'; elB.style.zIndex = '5';
        audio.swap();
        await sleep(280);
        elA.style.transition = ''; elB.style.transition = '';
        elA.style.zIndex = ''; elB.style.zIndex = '';
    }
    swapCells(state.grid, r1, c1, r2, c2);
    state.lastSwapped = [
        {r:r1, c:c1, data:state.grid[r1][c1]},
        {r:r2, c:c2, data:state.grid[r2][c2]},
    ];
    updateCell(r1, c1);
    updateCell(r2, c2);
    const newA = getCellEl(r1, c1)?.querySelector('.crystal');
    const newB = getCellEl(r2, c2)?.querySelector('.crystal');
    if(newA) newA.classList.remove('animating');
    if(newB) newB.classList.remove('animating');

    await sleep(30);
    const matches = findMatches(state.grid);
    const rareInLine = checkRareInLine(r1, c1, r2, c2);

    if(matches.length === 0 && !rareInLine){
        const rcA = getCellEl(r1, c1)?.querySelector('.crystal');
        const rcB = getCellEl(r2, c2)?.querySelector('.crystal');
        if(rcA && rcB){
            const dx = (c1 - c2) * (cellSize + cellGap);
            const dy = (r1 - r2) * (cellSize + cellGap);
            rcA.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
            rcB.style.transition = 'transform .28s cubic-bezier(.34,1.56,.64,1)';
            rcA.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
            rcB.style.transform = `translate3d(${-dx}px, ${-dy}px, 0)`;
            await sleep(280);
        }
        swapCells(state.grid, r1, c1, r2, c2);
        state.lastSwapped = null;
        updateCell(r1, c1); updateCell(r2, c2);
        const shakeA = getCellEl(r1, c1)?.querySelector('.crystal');
        const shakeB = getCellEl(r2, c2)?.querySelector('.crystal');
        if(shakeA){ shakeA.classList.add('shake'); setTimeout(()=>shakeA.classList.remove('shake'), 400); }
        if(shakeB){ shakeB.classList.add('shake'); setTimeout(()=>shakeB.classList.remove('shake'), 400); }
        audio.error();
        await sleep(400);
        state.animating = false;
        return;
    }
    if(rareInLine) await collectRare(rareInLine);
    if(matches.length > 0) await resolveMatches(matches);
    state.lastSwapped = null;
    state.animating = false;
    if(!hasPossibleMove(state.grid)) await autoReshuffle();
}

function checkRareInLine(r1, c1, r2, c2){
    for(const {r, c} of [{r:r1,c:c1}, {r:r2,c:c2}]){
        const d = state.grid[r][c];
        if(!d || !d.isRare) continue;
        const color = d.colorIdx;
        let cnt = 1, cells = [{r, c}];
        for(let i = c-1; i >= 0; i--){
            const x = state.grid[r][i];
            if(x && x.type === 'crystal' && !x.isRare && !x.isJoker && x.colorIdx === color){ cnt++; cells.push({r, c:i}); } else break;
        }
        for(let i = c+1; i < COLS; i++){
            const x = state.grid[r][i];
            if(x && x.type === 'crystal' && !x.isRare && !x.isJoker && x.colorIdx === color){ cnt++; cells.push({r, c:i}); } else break;
        }
        if(cnt >= 3) return {r, c, cells};
        cnt = 1; cells = [{r, c}];
        for(let i = r-1; i >= 0; i--){
            const x = state.grid[i][c];
            if(x && x.type === 'crystal' && !x.isRare && !x.isJoker && x.colorIdx === color){ cnt++; cells.push({r:i, c}); } else break;
        }
        for(let i = r+1; i < ROWS; i++){
            const x = state.grid[i][c];
            if(x && x.type === 'crystal' && !x.isRare && !x.isJoker && x.colorIdx === color){ cnt++; cells.push({r:i, c}); } else break;
        }
        if(cnt >= 3) return {r, c, cells};
    }
    return null;
}

async function collectRare(info){
    const {r, c} = info;
    const cell = state.grid[r][c];
    if(!cell || !cell.isRare) return;
    state.rareGems++;
    state.totalRareCollected++;
    audio.rare();
    const cr = getCellEl(r, c)?.querySelector('.crystal');
    if(cr) cr.classList.add('pop');
    const pos = getCellCenter(r, c);
    if(pos) spawnExplosion(pos.x, pos.y, '#ffdd59', 20);
    showToast(t('toast_rareCollected') + ' +1 💎');
    await sleep(400);
    state.grid[r][c] = null;
    saveAll();
    updateHUD();
}

async function explodeCells(cells, originR, originC, isJoker){
    const toRemove = [];
    for(const {r, c} of cells){
        if(r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
        const d = state.grid[r][c];
        if(!d) continue;
        if(d.isRare) continue;
        toRemove.push({r, c});
        const cr = getCellEl(r, c)?.querySelector('.crystal');
        if(cr) cr.classList.add('pop');
    }
    const originEl = getCellCenter(originR, originC);
    if(originEl){
        const isBig = isJoker || cells.length > 5;
        spawnExplosion(originEl.x, originEl.y, isBig ? '#ffdd59' : '#70e6ff', isBig ? 20 : 12);
    }
    audio.explode();
    let pts = 0;
    for(const {r, c} of toRemove){
        const d = state.grid[r][c];
        if(!d) continue;
        if(d.type === 'stone') pts += 50;
        else if(d.type === 'dirt') pts += 60;
        else if(d.isJoker) pts += 200;
        else if(d.isBomb) pts += 100;
        else pts += 20;
    }
    addScore(pts, originR, originC);
    audio.match(toRemove.length);
    await sleep(450);
    for(const {r, c} of toRemove) state.grid[r][c] = null;
    await applyGravityAndRefill();
    await sleep(150);
    const m = findMatches(state.grid);
    if(m.length > 0) await resolveMatches(m);
}

// Проверка: какие клетки земли соседствуют с удалёнными гемами
function findAdjacentDirt(removedSet){
    const dirts = [];
    const visited = new Set();
    for(const key of removedSet){
        const [r, c] = key.split(',').map(Number);
        for(const [dr, dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
            const nr = r + dr, nc = c + dc;
            if(nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
            const k2 = nr + ',' + nc;
            if(visited.has(k2)) continue;
            const d = state.grid[nr][nc];
            if(d && d.type === 'dirt'){
                visited.add(k2);
                dirts.push({r:nr, c:nc});
            }
        }
    }
    return dirts;
}

async function resolveMatches(matches){
    const toRemove = new Set();
    const specials = [];
    const bombsInLines = [];

    for(const m of matches){
        const cells = m.cells;
        for(const {r, c} of cells){
            const d = state.grid[r][c];
            if(d && d.isBomb) bombsInLines.push({r, c});
        }
        if(cells.length >= 5){
            const mid = cells[Math.floor(cells.length/2)];
            specials.push({r:mid.r, c:mid.c, type:'joker'});
            for(const {r, c} of cells){
                if(r === mid.r && c === mid.c) continue;
                toRemove.add(r + ',' + c);
            }
        } else if(cells.length === 4){
            let pos = null;
            if(state.lastSwapped){
                for(const sw of state.lastSwapped){
                    if(cells.some(cc => cc.r === sw.r && cc.c === sw.c)){ pos = {r:sw.r, c:sw.c}; break; }
                }
            }
            if(!pos) pos = {r:cells[1].r, c:cells[1].c};
            specials.push({r:pos.r, c:pos.c, type:'bomb', colorIdx:m.colorIdx});
            for(const {r, c} of cells){
                if(r === pos.r && c === pos.c) continue;
                toRemove.add(r + ',' + c);
            }
        } else {
            for(const {r, c} of cells) toRemove.add(r + ',' + c);
        }
    }
    for(const bp of bombsInLines) toRemove.delete(bp.r + ',' + bp.c);

    // Находим соседнюю землю ДО удаления гемов
    const adjacentDirt = findAdjacentDirt(toRemove);

    for(const key of toRemove){
        const [r, c] = key.split(',').map(Number);
        const cr = getCellEl(r, c)?.querySelector('.crystal');
        if(cr) cr.classList.add('pop');
    }
    for(const {r, c} of adjacentDirt){
        const cr = getCellEl(r, c)?.querySelector('.crystal');
        if(cr) cr.classList.add('pop');
    }
    let pts = 0;
    for(const key of toRemove){
        const [r, c] = key.split(',').map(Number);
        const d = state.grid[r][c];
        if(!d) continue;
        if(d.type === 'stone') pts += 50;
        else if(d.isRare) pts += 0;
        else pts += 20;
    }
    if(pts > 0 && toRemove.size > 0){
        const first = toRemove.values().next().value;
        const [fr, fc] = first.split(',').map(Number);
        addScore(pts, fr, fc);
    }
    if(toRemove.size > 0) audio.match(toRemove.size);
    await sleep(450);

    for(const key of toRemove){
        const [r, c] = key.split(',').map(Number);
        state.grid[r][c] = null;
    }
    for(const {r, c} of adjacentDirt){
        state.grid[r][c] = null;
        if(state.mode === 'digger'){ state.dirtLeft--; audio.dig(); }
    }
    for(const bp of bombsInLines){
        const cell = state.grid[bp.r] && state.grid[bp.r][bp.c];
        if(!cell || !cell.isBomb) continue;
        cell.isBomb = false;
        const blast = getBombBlastCells(state.grid, bp.r, bp.c);
        // Также убираем соседнюю землю от взрыва
        const blastDirt = findAdjacentDirt(new Set(blast.map(x => x.r + ',' + x.c)));
        for(const {r, c} of blast){
            const cr = getCellEl(r, c)?.querySelector('.crystal');
            if(cr) cr.classList.add('pop');
        }
        for(const {r, c} of blastDirt){
            const cr = getCellEl(r, c)?.querySelector('.crystal');
            if(cr) cr.classList.add('pop');
        }
        const originEl = getCellCenter(bp.r, bp.c);
        if(originEl) spawnExplosion(originEl.x, originEl.y, '#ffdd59', 20);
        audio.explode();
        await sleep(320);
        let bp2 = 0;
        for(const {r, c} of blast){
            const d = state.grid[r][c];
            if(!d) continue;
            if(d.type === 'stone') bp2 += 50;
            else if(d.type === 'dirt') bp2 += 60;
            else if(d.isJoker) bp2 += 200;
            else if(d.isBomb && !(r === bp.r && c === bp.c)) bp2 += 100;
            else bp2 += 20;
        }
        if(bp2 > 0) addScore(bp2, bp.r, bp.c);
        for(const {r, c} of blast) state.grid[r][c] = null;
        for(const {r, c} of blastDirt){
            state.grid[r][c] = null;
            if(state.mode === 'digger'){ state.dirtLeft--; audio.dig(); }
        }
        await sleep(80);
    }
    for(const s of specials){
        const target = state.grid[s.r] && state.grid[s.r][s.c];
        if(target && target.type === 'crystal' && !target.isRare && !target.isBomb && !target.isJoker){
            if(s.type === 'bomb') target.isBomb = true;
            else { target.isJoker = true; target.isBomb = false; target.shape = JOKER_SHAPE; }
        } else if(!target){
            const base = makeCrystalData();
            if(s.type === 'bomb') base.isBomb = true;
            else { base.isJoker = true; base.isBomb = false; base.shape = JOKER_SHAPE; }
            state.grid[s.r][s.c] = base;
        }
        updateCell(s.r, s.c);
    }
    await applyGravityAndRefill();
    await sleep(200);
    updateHUD();
    // Проверка победы в землекопе
    if(state.mode === 'digger' && state.dirtLeft <= 0 && state.gameActive){
        await onDiggerComplete();
        return;
    }
    const nm = findMatches(state.grid);
    if(nm.length > 0) await resolveMatches(nm);
}

async function applyGravityAndRefill(){
    const fallMap = {};
    for(let c = 0; c < COLS; c++){
        let writeRow = ROWS - 1;
        for(let r = ROWS - 1; r >= 0; r--){
            if(state.grid[r][c]){
                const d = state.grid[r][c];
                // Земля и камни не падают
                if(d.type === 'dirt' || d.type === 'stone'){
                    // Если под ней пусто и есть кристалл выше — стоп
                    // Проверим: если после этой клетки ещё есть кристаллы выше, они должны падать до земли
                    writeRow = r - 1;
                    continue;
                }
                if(writeRow !== r){
                    // Не падаем поверх земли/камня — только в пустоту
                    state.grid[writeRow][c] = d;
                    state.grid[r][c] = null;
                    fallMap[writeRow + ',' + c] = writeRow - r;
                }
                writeRow--;
            }
        }
        for(let r = writeRow; r >= 0; r--){
            if(!state.grid[r][c]){
                state.grid[r][c] = randCrystal();
                fallMap[r + ',' + c] = writeRow + 1;
            }
        }
    }
    for(const key in fallMap){
        const [r, c] = key.split(',').map(Number);
        updateCell(r, c);
    }
    for(const key in fallMap){
        const [r, c] = key.split(',').map(Number);
        const cr = getCellEl(r, c)?.querySelector('.crystal');
        if(cr){
            const dist = fallMap[key] * (cellSize + cellGap);
            cr.style.transform = `translate3d(0, ${-dist}px, 0)`;
            cr.style.transition = 'none';
            cr.style.opacity = '0.4';
            requestAnimationFrame(() => {
                cr.style.transition = 'transform .4s cubic-bezier(.34,1.56,.64,1), opacity .3s';
                cr.style.transform = 'translate3d(0,0,0)';
                cr.style.opacity = '1';
            });
        }
    }
    await sleep(430);
}

async function autoReshuffle(){
    const msg = document.createElement('div');
    msg.className = 'board-message';
    msg.textContent = t('msg_reshuffle');
    boardEl.appendChild(msg);
    await sleep(1200);
    msg.remove();
    const crystals = [];
    for(let r = 0; r < ROWS; r++){
        for(let c = 0; c < COLS; c++){
            const d = state.grid[r][c];
            if(d && d.type === 'crystal') crystals.push(d);
        }
    }
    for(let i = crystals.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [crystals[i], crystals[j]] = [crystals[j], crystals[i]];
    }
    let idx = 0;
    for(let r = 0; r < ROWS; r++){
        for(let c = 0; c < COLS; c++){
            const d = state.grid[r][c];
            if(d && (d.type === 'stone' || d.type === 'dirt')) continue;
            let placed = false, attempts = 0;
            while(!placed && attempts < 100){
                attempts++;
                const cand = crystals[idx % crystals.length];
                if(!wouldMatch(state.grid, r, c, cand.colorIdx)){
                    state.grid[r][c] = cand;
                    idx++;
                    placed = true;
                } else idx++;
            }
            if(!placed) state.grid[r][c] = randCrystal();
        }
    }
    renderBoard();
    if(!hasPossibleMove(state.grid)) await autoReshuffle();
}

        if(stones.length === 0) return;
        for(const {r, c} of stones){
            const cr = getCellEl(r, c)?.querySelector('.crystal');

        }

function checkBoosterExpiry(){
    const now = Date.now();
    let changed = false;
    for(const id in state.boosters){
        const b = state.boosters[id];
        if(b.expiresAt && b.expiresAt < now && b.count > 0){ b.count--; b.expiresAt = null; changed = true; }
    }
    if(changed) saveAll();
}
function applyActiveBoosters(){
    checkBoosterExpiry();
    const bb = state.boosters['bombs_jokers'];
    const sb = state.boosters['stone_breaker'];
    state.gameBombsJokerBonus = bb && bb.count > 0 && bb.expiresAt;
    const sbActive = sb && sb.count > 0 && sb.expiresAt;
    if(sbActive && state.mode === 'stones') startStoneBreakerTimer();
    else stopStoneBreakerTimer();
}

function getCellCenter(r, c){
    const cell = getCellEl(r, c);
    if(!cell) return null;
    const rect = cell.getBoundingClientRect();
    const br = boardEl.getBoundingClientRect();
    return { x: rect.left - br.left + rect.width/2, y: rect.top - br.top + rect.height/2 };
}

function findHint(){
    for(let r = 0; r < ROWS; r++){
        for(let c = 0; c < COLS; c++){
            const a = state.grid[r][c];
            if(!a || a.type !== 'crystal' || a.isJoker || a.isRare) continue;
            if(c+1 < COLS){
                const b = state.grid[r][c+1];
                if(b && b.type === 'crystal' && !b.isJoker){
                    swapCells(state.grid, r, c, r, c+1);
                    const m = findMatches(state.grid);
                    swapCells(state.grid, r, c, r, c+1);
                    if(m.length > 0) return [{r,c},{r,c:c+1}];
                }
            }
            if(r+1 < ROWS){
                const b = state.grid[r+1][c];
                if(b && b.type === 'crystal' && !b.isJoker){
                    swapCells(state.grid, r, c, r+1, c);
                    const m = findMatches(state.grid);
                    swapCells(state.grid, r, c, r+1, c);
                    if(m.length > 0) return [{r,c},{r:r+1,c}];
                }
            }
        }
    }
    return null;
}
function showHint(){
    const h = findHint();
    if(!h){ showToast(t('toast_noMoves')); return; }
    for(const {r, c} of h){
        const cr = getCellEl(r, c)?.querySelector('.crystal');
        if(cr){ cr.classList.add('hint'); setTimeout(() => cr.classList.remove('hint'), 2800); }
    }
}

function buildTextureGrid(){
    const grid = $('textureGrid');
    grid.innerHTML = '';
    const frag = document.createDocumentFragment();
    for(const sd of TEXTURE_SLOTS){
        const i = sd.idx;
        const slot = document.createElement('div');
        slot.className = 'texture-slot';
        if(state.textures[i]) slot.classList.add('loaded');
        const prev = document.createElement('div');
        prev.className = 'texture-preview';
        const cr = document.createElement('div');
        cr.className = 'crystal';
        if(sd.type === 'crystal'){ cr.classList.add('shape-' + sd.shape); cr.classList.add(sd.css); cr.classList.add('lit'); }
        else if(sd.type === 'joker'){ cr.classList.add('joker'); cr.classList.add('shape-' + JOKER_SHAPE); }
        else if(sd.type === 'stone'){ cr.classList.add('stone'); cr.classList.add('shape-hexagon'); }
        else if(sd.type === 'rare'){ cr.classList.add('rare'); cr.classList.add('shape-' + RARE_SHAPE); cr.classList.add('c-yellow'); }
        else if(sd.type === 'dirt'){ cr.classList.add('dirt'); cr.classList.add('shape-dirt'); }
        const tex = state.textures[i];
        if(tex){ cr.style.setProperty('--texture', `url(${tex})`); cr.classList.add('has-texture'); }
        prev.appendChild(cr);
        const name = document.createElement('div');
        name.className = 'slot-name';
        name.textContent = sd.name;
        const status = document.createElement('div');
        status.className = 'slot-status';
        status.textContent = '✓';
        const clr = document.createElement('button');
        clr.className = 'clear-btn';
        clr.textContent = '×';
        clr.addEventListener('click', e => {
            e.stopPropagation();
            state.textures[i] = null;
            saveTextures();
            buildTextureGrid();
            if(state.gameActive) renderBoard();
        });
        slot.appendChild(prev); slot.appendChild(name); slot.appendChild(status); slot.appendChild(clr);
        slot.addEventListener('click', () => {

            inp.value = '';

        });

    }

}

                saveAll();
                updateHUD();
                buildShop();
                showToast('✅ +' + ex.coins + ' 🪙');
            });
            item.appendChild(btn);
            grid.appendChild(item);
        }
    } else {
        for(const b of SHOP_BOOSTERS){
            const item = document.createElement('div');
            item.className = 'shop-item';
            const owned = state.boosters[b.id] && state.boosters[b.id].count > 0;
            item.innerHTML = `
                <div class="shop-item-icon">${b.icon}</div>
                <div class="shop-item-title">${b.title}</div>
                <div class="shop-item-desc">${b.desc}</div>
                <div class="shop-item-price">🪙 ${b.price}</div>
            `;
            const btn = document.createElement('button');
            btn.className = 'shop-buy' + (owned ? ' owned' : '');
            if(owned) btn.textContent = t('ownedBtn') + ' (' + state.boosters[b.id].count + ')';
            else btn.textContent = t('buyBtn');
            btn.disabled = state.coins < b.price;
            if(!owned) btn.addEventListener('click', () => {
                if(state.coins < b.price){ showToast(t('toast_notEnoughCoins')); return; }
                state.coins -= b.price;
                if(!state.boosters[b.id]) state.boosters[b.id] = { count:0, expiresAt:null };
                state.boosters[b.id].count++;
                audio.buy();
                saveAll();
                updateHUD();
                buildShop();
                showToast(t('toast_bought'));
            });
            item.appendChild(btn);
            grid.appendChild(item);
        }
    }
}
document.querySelectorAll('.shop-tab').forEach(tab => {
    tab.addEventListener('click', function(){
        document.querySelectorAll('.shop-tab').forEach(x => x.classList.remove('active'));
        this.classList.add('active');
        shopTab = this.dataset.tab;
        buildShop();
    });
});
$('btnShop').addEventListener('click', () => { buildShop(); $('shopModal').classList.add('active'); });
$('btnCloseShop').addEventListener('click', () => $('shopModal').classList.remove('active'));
$('shopModal').addEventListener('click', e => { if(e.target === $('shopModal')) $('shopModal').classList.remove('active'); });

function buildChangelog(){
    const list = $('changelogList');
    list.innerHTML = '';
    const frag = document.createDocumentFragment();
    for(const v of CHANGELOG){
        const li = document.createElement('li');
        li.className = 'changelog-version' + (v.latest ? ' latest' : '');
        const h = document.createElement('div');
        h.className = 'changelog-header';
        h.innerHTML = `<span class="changelog-ver${v.latest?' latest':''}">v${v.version}</span><span class="changelog-date">${v.date}</span>`;
        li.appendChild(h);
        const ul = document.createElement('ul');
        ul.className = 'changelog-items';
        for(const it of v.items){
            const l = document.createElement('li');
            l.className = it.type;
            l.textContent = it.text;
            ul.appendChild(l);
        }
        li.appendChild(ul);
        frag.appendChild(li);
    }
    list.appendChild(frag);
}
$('btnChangelog').addEventListener('click', () => { buildChangelog(); $('changelogModal').classList.add('active'); });
$('btnCloseChangelog').addEventListener('click', () => $('changelogModal').classList.remove('active'));
$('changelogModal').addEventListener('click', e => { if(e.target === $('changelogModal')) $('changelogModal').classList.remove('active'); });

function openSettings(){
    $('toggleMusic').classList.toggle('active', state.musicEnabled);
    $('toggleSfx').classList.toggle('active', state.sfxEnabled);
    $('musicVolume').value = Math.round(state.musicVolume * 100);
    $('sfxVolume').value = Math.round(state.sfxVolume * 100);
    $('musicVolumeVal').textContent = Math.round(state.musicVolume * 100) + '%';
    $('sfxVolumeVal').textContent = Math.round(state.sfxVolume * 100) + '%';
    $('musicVolume').disabled = !state.musicEnabled;
    $('sfxVolume').disabled = !state.sfxEnabled;
    $('settingsModal').classList.add('active');
}
$('btnSettings').addEventListener('click', openSettings);
$('btnCloseSettings').addEventListener('click', () => $('settingsModal').classList.remove('active'));
$('settingsModal').addEventListener('click', e => { if(e.target === $('settingsModal')) $('settingsModal').classList.remove('active'); });
$('toggleMusic').addEventListener('click', function(){
    state.musicEnabled = music.toggle();
    this.classList.toggle('active', state.musicEnabled);
    $('musicVolume').disabled = !state.musicEnabled;
    saveAll();
    showToast(state.musicEnabled ? t('toast_musicOn') : t('toast_musicOff'));
});
$('toggleSfx').addEventListener('click', function(){
    state.sfxEnabled = !state.sfxEnabled;
    this.classList.toggle('active', state.sfxEnabled);
    $('sfxVolume').disabled = !state.sfxEnabled;
    saveAll();
    showToast(state.sfxEnabled ? t('toast_sfxOn') : t('toast_sfxOff'));
    if(state.sfxEnabled) audio.click();
});
$('musicVolume').addEventListener('input', function(){
    const v = +this.value / 100;
    music.setVolume(v);
    $('musicVolumeVal').textContent = this.value + '%';
    saveAll();
});
$('sfxVolume').addEventListener('input', function(){
    const v = +this.value / 100;
    audio.setVolume(v);
    $('sfxVolumeVal').textContent = this.value + '%';
    saveAll();
});

function startGame(mode){
    if(mode === 'digger' && !state.diggerUnlocked){
        showToast(t('toast_diggerLocked'));
        audio.error();
        return;
    }
    audio.click();
    state.mode = mode;
    state.grid = generateGrid(mode);
    state.score = 0;
    state.selected = null;
    state.animating = false;
    state.gameActive = true;
    state.gamesPlayed++;
    state.lastSwapped = null;
    saveAll();
    updateHUD();
    menuEl.classList.add('hidden');
    gameEl.classList.add('active');
    weatherLayer.innerHTML = '';
    applyActiveBoosters();
    $('levelInfo').style.display = (mode === 'classic') ? '' : 'none';
    $('levelProgressWrap').style.display = (mode === 'classic') ? '' : 'none';
    $('diggerInfo').style.display = (mode === 'digger') ? '' : 'none';
    requestAnimationFrame(() => {
        renderBoard();
        if(!hasPossibleMove(state.grid)) autoReshuffle();
    });
}
function goToMenu(){
    audio.click();
    state.gameActive = false;
    gameEl.classList.remove('active');
    menuEl.classList.remove('hidden');
    applyMenuAtmosphere();
    stopStoneBreakerTimer();
    updateHUD();
    saveAll();
}
$('btnClassic').addEventListener('click', () => startGame('classic'));
$('btnStones').addEventListener('click', () => startGame('stones'));
$('btnDigger').addEventListener('click', () => startGame('digger'));
$('btnMenu').addEventListener('click', goToMenu);
$('btnHint').addEventListener('click', () => { audio.click(); showHint(); });

function applyTranslations(){
    document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    document.querySelectorAll('[data-i18n-title]').forEach(el => el.title = t(el.dataset.i18nTitle));
    updateAtmosphereLabels();
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
    document.documentElement.lang = currentLang;
}
function setLanguage(lang){
    if(!TRANSLATIONS[lang]) return;
    currentLang = lang;
    saveAll();
    applyTranslations();
}
document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', function(){ setLanguage(this.dataset.lang); });
});

loadAll();
loadTextures();
loadAtmo();

applyTranslations();
updateHUD();
applyMenuAtmosphere();
$('toggleMusic').classList.toggle('active', state.musicEnabled);
$('toggleSfx').classList.toggle('active', state.sfxEnabled);
audio.setVolume(state.sfxVolume);

if(state.musicEnabled){
    const startOnFirstClick = () => {
        if(state.musicEnabled && !music.isPlaying) music.start();
        document.removeEventListener('click', startOnFirstClick);
        document.removeEventListener('touchstart', startOnFirstClick);
    };
    document.addEventListener('click', startOnFirstClick, {once:true});
    document.addEventListener('touchstart', startOnFirstClick, {once:true});
}

setInterval(() => { checkBoosterExpiry(); updateHUD(); }, 30000);
setInterval(() => { if(!state.gameActive) applyMenuAtmosphere(); }, 5 * 60 * 1000);

document.querySelectorAll('#seasonBtns .atmo-btn').forEach(btn => {
    btn.addEventListener('click', function(){
        state.manualSeason = this.dataset.season;
        if(state.manualSeason !== 'winter' && state.manualWeather === 'snow') state.manualWeather = 'clear';
        saveAtmo();
        applyMenuAtmosphere();
        audio.click();
    });
});
document.querySelectorAll('#weatherBtns .atmo-btn').forEach(btn => {
    btn.addEventListener('click', function(){
        if(this.disabled) return;
        state.manualWeather = this.dataset.weather;
        saveAtmo();
        applyMenuAtmosphere();
        audio.click();
    });
});

let rt;
window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
        if(state.gameActive) renderBoard();
        applyMenuAtmosphere();
    }, 150);
});

})();
</script>
</body>
</html>
